  - {version: 2, since: "0.6.0", reason: "identical_rhyme is decided by spelling before the dictionary, so a wanted pair ending twice on a word it lacks (Lear's 'Ryde') is identical_rhyme under every unknown_rhyme reading instead of unscored, matched or unknown_rhyme; to keep English contractions such as dimm'd and vntrim'd from comparing as the same word d, the comparison reads past an elided proclitic only in French; and the English rhyme key reads a secondary stress after the rhyme vowel as unstressed (ADR 0057), so willow (IH1 L OW2) and pillow (IH1 L OW0) rhyme where they did not, and a pair kept apart on that difference alone is now unwanted_rhyme; and the English pack cuts CMUdict's inline comments at the '#', so the 20 headwords the pack reaches that carry one (aalto, hiv, fine's second reading, ...) no longer key a rhyme on the comment's words"}
