sapphic_stanza:
  - {version: 1, since: "0.5.0", reason: baseline}
  - {version: 2, since: "0.6.0", reason: "The English spelling heuristic reads a leading there, where, here or ere with its silent e inside an adverbial compound (erewhile, therewith, wherefore) a syllable shorter, which moves a line's count or scan wherever the dictionary lacks the word; and the English pack cuts CMUdict's inline comments at the '#', so an -s/-es form read through porthos or danglars gains its sibilant syllable (porthoses, danglarses: 2 to 3)"}
