# Rows with no externally sourced golden case, and why (ADR 0062). Cases added from
# 2026-10-12 quote public-domain text only, under the public-domain cutoff ADR 0062
# states. A row leaves this file in the commit that lands its first external case.
#
# Every note states only what the catalogue row or the research batches record.
# `after_cutoff` is kept for rows whose catalogue `source` traces the form to a dated
# origin after the cutoff. A row whose catalogue attribution is `reference` cites a
# standard work, so its date says nothing about when the form began: unless its source
# also names a dated origin (`s_plus_7`), it is `none_found`.

