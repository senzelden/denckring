# Attested shop names are quoted here by the maintainer's ruling of 2026-09-10,
# which settled the question ADR 0041 D7 had deferred. A business name is a name,
# not a work: quoting one is nominative use, and the collections below are
# journalism and public registers rather than anthologies. Each case names where
# it was seen. None was collated against a shopfront; what is claimed is that the
# name appears in the source given, which is what `provenance: external` means
# here and everywhere in this corpus.
#
# The verdicts are read off the run, never written from expectation. Several are
# `satisfied: false`, and those are the useful ones: a limit met on a real name
# from the tradition is worth more than another example of the row working.
procedure: amphibologia
lang: en
cases:
  - name: a-cut-above
    source: >-
      constructed example; `cut` carries seventy senses in Open English WordNet,
      so the salon's reading is one of many available
    text: A Cut Above
    params: { domain: hair }
    satisfied: true

  - name: shear-delight
    source: constructed example
    text: Shear Delight
    params: { domain: hair }
    satisfied: true

  - name: nothing-of-the-trade
    source: constructed counterexample; `no_trade_word`
    text: Nothing relevant here
    params: { domain: hair }
    satisfied: false

  - name: a-word-with-one-sense
    source: >-
      constructed counterexample; `unambiguous`. The test the row rests on — a
      trade word that means only one thing offers no second reading
    text: A xylophone above
    params: { domain_words: [xylophone] }
    satisfied: false

  - name: der-letzte-schnitt
    lang: de
    source: constructed example; `Schnitt` carries ten senses in German Wiktionary
    text: Der letzte Schnitt
    params: { domain: hair }
    satisfied: true
    requires: [lexicon.glosses]

  - name: la-coupe-est-pleine
    lang: fr
    source: constructed example; `coupe` carries twenty-four senses in Wiktionnaire
    text: la coupe est pleine
    params: { domain: hair }
    satisfied: true
    requires: [lexicon.glosses]

  - name: a-cut-above-attested
    provenance: external
    source: >-
      Atlas Obscura, "Hair They Are". Nothing is displaced and nothing spliced:
      the salon makes the second reading of `cut`, which Open English WordNet
      gives seventy senses.
    text: A Cut Above
    params: { domain: hair }
    satisfied: true

  - name: curl-up-and-dye-as-found
    provenance: external
    source: >-
      Atlas Obscura, "Hair They Are". The same name that appears in
      `paronomasia.yaml` as a displacement, read the other way: taken as it
      stands, `curl` and `dye` are both the trade's and both carry more than one
      sense. One name, two figures, and the rows disagree about nothing — they
      are answering different questions.
    text: Curl Up and Dye
    params: { domain: hair }
    satisfied: true
