procedure: acrostic
lang: en
cases:
  - name: carroll-alice
    source: Lewis Carroll, A Boat Beneath a Sunny Sky (1871), opening stanza
    text: |-
      A boat beneath a sunny sky
      Lingering onward dreamily
      In an evening of July
      Children three that nestle near
      Eager eye and willing ear
    params: { target: ALICE }
    satisfied: true
  - name: wrong-initials
    source: constructed counterexample
    text: |-
      Apple
      Zebra
    params: { target: AB }
    satisfied: false
  - name: welt
    lang: de
    source: constructed example
    text: |-
      Wolken ziehen weit
      Einsam steht der Baum
      Leise fällt der Schnee
      Traum und Nacht vergehn
    params: { target: WELT }
    satisfied: true
  - name: falsche-initialen
    lang: de
    source: constructed counterexample
    text: |-
      Wolken ziehen weit
      Nebel steht im Tal
    params: { target: WE }
    satisfied: false
  - name: eszett-target-claims-two-units
    lang: de
    source: >-
      constructed example; ß folds to ss and the text side already spends two
      units on it, so the target must too (ADR 0035)
    text: "Sonne\nsehr\ntanzt"
    params: { target: "ßt", unit: line }
    satisfied: true
