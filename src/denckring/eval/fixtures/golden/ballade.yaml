      https://archive.org/details/balladesrondeau00whit/page/n120. Brander Matthews died
      1929, White 1898. Selected: re-measured 2026-10-14, the checker rejects 76 of the 77
      poems the screen stated in tomson-ballade-of-asphodel selects at the default metre, 77
      at pentameter (0101010101), 76 at trimeter (010101), and 61 with metre unset, all 61
