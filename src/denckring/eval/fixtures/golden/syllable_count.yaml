procedure: syllable_count
lang: en
cases:
  - name: matches-the-pattern
    source: constructed example
    text: |-
      the cat sat
      the dog
    params: { pattern: [3, 2] }
    satisfied: true
  - name: wrong-line
    source: constructed counterexample
    text: |-
      the cat sat
      the dog ran fast
    params: { pattern: [3, 2] }
    satisfied: false
  - name: silben-treffen-das-muster
    lang: de
    source: constructed example
    text: |-
      der Hund schläft
      die Katze
    params: { pattern: [3, 3] }
    satisfied: true
  - name: eine-zeile-zu-lang
    lang: de
    source: constructed counterexample
    text: |-
      der Hund schläft
      die Katze rennt sehr schnell
    params: { pattern: [3, 3] }
    satisfied: false
  - name: syllabes-conformes-au-motif
    lang: fr
    source: constructed example
    text: |-
      le vent
      la nuit tombe
    params: { pattern: [2, 3] }
    satisfied: true
  - name: une-ligne-trop-longue
    lang: fr
    source: constructed counterexample
    text: |-
      le vent
      la pluie tombe
    params: { pattern: [2, 3] }
    satisfied: false
