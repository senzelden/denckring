procedure: renga
lang: en
cases:
  - name: alternating-chain
    source: constructed example; the 5-7-5 / 7-7 alternation is the form's
    text: |-
      cat dog mat sat run
      cat dog mat sat run sky tree
      cat dog mat sat run

      cat dog mat sat run sky tree
      cat dog mat sat run sky tree
    params: {}
    satisfied: true
  - name: single-stanza
    source: constructed counterexample; one hokku is not a renga
    text: |-
      cat dog mat sat run
      cat dog mat sat run sky tree
      cat dog mat sat run
    params: {}
    satisfied: false
  - name: teich-und-mond-kette
    lang: de
    source: constructed example
    text: |-
      ein alter Teich dort
      ein Frosch springt in das Wasser
      das Wasser klingt hell

      der Mond steht über dem Haus
      und niemand sagt ein Wort mehr
    params: {}
    satisfied: true
  - name: chaine-jardin-et-silence
    lang: fr
    source: constructed example
    text: |-
      un vieux jardin dort
      le silence tombe enfin
      un chat noir traverse

      et le temps passe en silence
      la brume couvre la ville
    params: {}
    satisfied: true
  - name: une-seule-strophe
    lang: fr
    source: constructed counterexample; one hokku is not a renga
    text: |-
      un vieux jardin dort
      le silence tombe enfin
      un chat noir traverse
    params: {}
    satisfied: false
