procedure: rhyme_scheme
lang: en
cases:
  - name: abab
    source: constructed example
    text: |-
      the cat can see the moon above the tree
      the dog will run across the field today
      a bird can fly around the house at three
      the sun will set behind the hill in may
    params: { scheme: ABAB }
    satisfied: true
  - name: not-abab
    source: constructed counterexample
    text: |-
      the cat can see the moon above the tree
      the dog will run across the field today
      a bird can fly around the house at noon
      the sun will set behind the hill at nine
    params: { scheme: ABAB }
    satisfied: false
  - name: paarreim
    lang: de
    source: "constructed example"
    text: |-
      der Wandrer zieht durch jenes weite Land
      das Feuer brennt und wärmt die kalte Hand
      der Wind bewegt die Blätter in der Nacht
      der Regen fällt und niemand hat gelacht
    params: { scheme: "AABB" }
    satisfied: true
  - name: kreuzreim-verfehlt
    lang: de
    source: "constructed counterexample; the scheme asks for ABAB and the text pairs"
    text: |-
      der Wandrer zieht durch jenes weite Land
      das Feuer brennt und wärmt die kalte Hand
      der Wind bewegt die Blätter in der Nacht
      der Regen fällt und niemand hat gelacht
    params: { scheme: "ABAB" }
    satisfied: false
  - name: rime-plate
    lang: fr
    source: "constructed example"
    text: |-
      la belle rose
      une autre chose
    params: { scheme: "AA" }
    satisfied: true
  - name: rime-manquante
    lang: fr
    source: "constructed counterexample; rose and noir do not rhyme"
    text: |-
      la belle rose
      un grand chat noir
    params: { scheme: "AA" }
    satisfied: false
  - name: dubellay-regrets-31-rhymescheme
    lang: fr
    source: >-
      Joachim du Bellay, Les Regrets (1558, Fédéric Morel), sonnet XXXI
      "Heureux qui, comme Ulysse" — a sonnet marotique in alexandrines, sestet
      CCD EED per the Jolliffe/Screech critical edition (Droz, TLF). Landed
      against rhyme_scheme rather than sonnet because sonnet requires
      `stress`, which French does not have (ADR 0034 D3).
    text: |-
      Heureux qui, comme Ulysse, a fait un beau voyage,
      Ou comme cestuy la qui conquit la toison,
      Et puis est retourné, plein d'usage et raison,
      Vivre entre ses parents le reste de son aage !
      Quand reverray-je, helas, de mon petit village
      Fumer la cheminee, et en quelle saison
      Reverray-je le clos de ma pauvre maison,
      Qui m'est une province, et beaucoup d'avantage ?
      Plus me plaist le sejour qu'ont basty mes ayeux,
      Que des palais Romains le front audacieux,
      Plus que le marbre dur me plaist l'ardoise fine ;
      Plus mon Loyre Gaulois, que le Tybre Latin,
      Plus mon petit Lyré, que le mont Palatin,
      Et plus que l'air marin la doulceur Angevine.
    params: { scheme: "ABBAABBACCDEED" }
    provenance: external
    satisfied: true
  - name: identical-rhyme-across-elision
    lang: fr
    source: >-
      constructed counterexample; l'amour and amour are the same rhyme word,
      and identical_rhyme must catch that even though the text-level word
      forms differ (ADR 0036)
    text: |-
      Il chante leur amour
      Il pense à l'amour
    params: { scheme: "AA" }
    satisfied: false
