  lang: de
  provenance: external
  source: 'Andreas Gryphius, "Thränen des Vaterlandes / Anno 1636" (first printed
    1637 as "Trawrklage des verwüsteten Deutschlandes"; this title & wording from
    the 1643 Leiden Sonnete and the 1663 Ausgabe letzter Hand). Rejected: `wrong_syllable_count`
    — one line reads 14 syllables where `feminine_ending: true` accepts 12 or 13.
    Measured on this HEAD: score 0.9286, 1 violation.'
  text: 'Wir sind doch nunmehr gantz / ja mehr denn gantz verheeret!

    Der frechen Völcker Schaar / die rasende Posaun

    Das vom Blutt fette Schwerdt / die donnernde Carthaun /

    Hat aller Schweiß / und Fleiß / und Vorrath auffgezehret.

    Die Türme stehn in Glutt / die Kirch ist umgekehret.

    Das Rathauß ligt im Grauß / die Starcken sind zerhaun /

    Die Jungfern sind geschänd''t / und wo wir hin nur schaun

    Ist Feuer / Pest / und Tod / der Hertz und Geist durchfähret.

    Hir durch die Schantz und Stadt / rinnt allzeit frisches Blutt.

    Dreymal sind schon sechs Jahr / als unser Ströme Flutt /

    Von Leichen fast verstopfft / sich langsam fort gedrungen.

    Doch schweig ich noch von dem / was ärger als der Tod /

    Was grimmer denn die Pest / und Glutt und Hungersnoth /

    Das auch der Seelen Schatz / so vilen abgezwungen.'
