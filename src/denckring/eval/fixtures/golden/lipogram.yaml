    provenance: external
    source: Ernest Vincent Wright, Gadsby (1939)
    text: >-
      If youth, throughout all history, had had a champion to stand up for it;
      to show a doubting world that a child can think.
    params: { forbidden: e }
    satisfied: true
  - name: ordinary-prose
