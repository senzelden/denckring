procedure: lipogram
lang: en
cases:
  - name: gadsby-opening
    provenance: external
    source: Ernest Vincent Wright, Gadsby (1939)
    text: >-
      If youth, throughout all history, had had a champion to stand up for it;
      to show a doubting world that a child can think.
    params: { forbidden: e }
    satisfied: true
  - name: ordinary-prose
    source: constructed counterexample
    text: The letter appears here repeatedly.
    params: { forbidden: e }
    satisfied: false
    max_score: 0.95
  - name: ohne-e
    lang: de
    source: constructed example
    text: Und so zog Wind durch kalt Rauch, ganz ohn Trost.
    params: { forbidden: e }
    satisfied: true
  - name: gewoehnliche-prosa
    lang: de
    source: constructed counterexample
    text: Der Wind weht heute wieder gegen jedes Fenster.
    params: { forbidden: e }
    satisfied: false
  - name: ohne-umlaut-a
    lang: de
    source: >-
      constructed example; forbidden="ä" folds to "a" and the text side folds
      too, so a text with no "a" at all must satisfy it (ADR 0035)
    text: Wolken ziehen über den Fluss
    params: { forbidden: ä }
    satisfied: true
  - name: enthaelt-umlaut-a
    lang: de
    source: >-
      constructed counterexample; contains "ä", which folds to the forbidden
      "a" — the inverted verdict ADR 0035's Known remaining names
    text: Wolken ziehen über den Fluss und Wälder
    params: { forbidden: ä }
    satisfied: false
  - name: sans-e
    lang: fr
    source: constructed example; the form is Perec's, in La Disparition (1969)
    text: Un fils qui court dans un champ, loin du bruit.
    params: { forbidden: e }
    satisfied: true
  - name: prose-ordinaire
    lang: fr
    source: constructed counterexample
    text: Le vent revient et le monde se tait.
    params: { forbidden: e }
    satisfied: false
