  - name: bombaugh-jovial-swain
    provenance: external
    source: >-
      C. C. Bombaugh, Gleanings for the Curious from the Harvest-Fields of Literature,
      enlarged ed. (Philadelphia: J. B. Lippincott, 1890; copyright 1874), pp. 27–28 (Bombaugh
      1828–1906): "The stanza subjoined is a specimen of both lipogrammatic and pangrammatic
      ingenuity, containing every letter of the alphabet except e." Anonymous, printed 1890
      (ADR 0062, amended 2026-10-13). Project Gutenberg #56805,
      https://www.gutenberg.org/files/56805/56805-h/56805-h.htm. Transcribed by script from
      the Project Gutenberg text, where the page marker before the stanza's first line is 28;
      the page image (https://archive.org/details/gleaningsforcuri00bomb) was not checked. The
      framing sentence is on p. 27.
    text: |-
      A jovial swain may rack his brain,
      And tax his fancy’s might,
      To quiz in vain, for ’tis most plain,
      That what I say is right.
    params: { forbidden: e }
    satisfied: true
  - name: bombaugh-fate-of-nassan
    provenance: external
    source: >-
      C. C. Bombaugh, Gleanings for the Curious from the Harvest-Fields of Literature,
      enlarged ed. (Philadelphia: J. B. Lippincott, 1890; copyright 1874), p. 28 (Bombaugh
      1828–1906): "The Fate of Nassan affords another example, each stanza containing the
      entire alphabet except e, and composed, as the writer says, with ease without e’s."
      Anonymous, printed 1890 (ADR 0062, amended 2026-10-13). Project Gutenberg #56805,
      https://www.gutenberg.org/files/56805/56805-h/56805-h.htm. Transcribed by script from
      the Project Gutenberg text, where the page marker before the framing sentence is 28; the
      page image (https://archive.org/details/gleaningsforcuri00bomb) was not checked. The
      verses only: in the Project Gutenberg text, the title "The Fate of Nassan", which has e,
      appears only in the framing sentence.
    text: |-
      Bold Nassan quits his caravan,
      A hazy mountain-grot to scan;
      Climbs jaggy rocks to spy his way,
      Doth tax his sight, but far doth stray.

      Not work of man, nor sport of child,
      Finds Nassan in that mazy wild;
      Lax grow his joints, limbs toil in vain—
      Poor wight! why didst thou quit that plain?

      Vainly for succor Nassan calls.
      Know, Zillah, that thy Nassan falls:
      But prowling wolf and fox may joy
      To quarry on thy Arab boy.
    params: { forbidden: e }
    satisfied: true
  - name: galaxy-1866-song-without-s
    provenance: external
    source: >-
      Anonymous song quoted in George Wakeman, "Tormenting the Alphabet", The Galaxy
      (New York: W. C. & F. P. Church), vol. 1, 1 July 1866, pp. 437-445, the song on
      p. 441. Wakeman introduces it as a "beautiful song, in which the obnoxious letter
      has no place", the letter being s, and names no author; on p. 438 he says many of
      the essay's examples "have been in print before". Anonymous, printed 1866 (ADR 0062,
      amended 2026-10-13); Wakeman died in 1870: the obituary "George Wakeman" in The
      Galaxy, May 1870 (archive.org sim_galaxy_1870-05_9_5), places his death in "the
      closing days of March", the year being the issue's. Archive.org
      sim_galaxy_1866-07-01_1, text layer
      https://archive.org/download/sim_galaxy_1866-07-01_1/sim_galaxy_1866-07-01_1_djvu.txt,
      extracted 2026-10-14 by script: the lines from "Oh! come to-night" through the third
      "Then come, love, come", blank lines dropped and whitespace collapsed, a space
      before ; ! : , closed up (the print sets a thin space there, which the OCR kept in
      "come ;"), and so is one after an opening quotation mark ("“ To-night");
      Wakeman's quotation marks (an opening one on each stanza, a closing one at the end)
      dropped as his quoting rather than the song's; a blank line after each refrain but
      the last, where the print breaks stanzas; curly apostrophes and the em dash as the
      text layer has them. Checked word for word against the page image,
      https://archive.org/download/sim_galaxy_1866-07-01_1/page/n68.jpg. Selected: the
      essay's one quoted text it presents as written without s, and the checker accepts
      it. Fulgentius's lipogrammatic prose and the poem Jami criticised are described, not
      quoted. Not screened: on p. 440 the essay quotes the opening quatrain of a poem from
      Punch's announced "Lispings from Low Latitudes", which spells s as th ("Tho’
      thplendid the Thummer thun"); the essay presents it as lisping, not as a text
      without s, so it is not an instance of the form (ADR 0062). It is not s-free
      either: "th’yines" keeps one s, in the text layer and the page image
      (https://archive.org/download/sim_galaxy_1866-07-01_1/page/n67.jpg), and the checker
      rejects it.
    text: |-
      Oh! come to-night; for naught can charm
      The weary time when thou’rt away.
      Oh! come; the gentle moon hath thrown
      O’er bower and hall her quivering ray.
      The heather-bell hath mildly flung,
      From off her fairy leaf, the bright
      And diamond dew-drop that had hung
      Upon that leaf—a gem of light.
      Then come, love, come!

      To-night the liquid wave hath not—
      Illumined by the moonlit beam
      Playing upon the lake beneath,
      Like frolic in an Autumn dream—
      The liquid wave hath not, to-night,
      In all her moonlit pride, a fair
      Gift like to them that on thy lip
      Do breathe and laugh, and home it there.
      Then come, love, come!

      To-night! to-night! my gentle one,
      The flower-bearing Amra tree
      Doth long, with fragrant moan, to meet
      The love-lip of the honey-bee.
      But not the Amra tree can long
      To greet the bee, at evening light,
      With half the deep, fond love I long
      To meet my Nama here to-night.
      Then come, love, come!
    params: { forbidden: s }
    satisfied: true
