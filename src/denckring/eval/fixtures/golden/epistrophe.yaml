procedure: epistrophe
lang: en
cases:
  - name: shared-closing
    source: constructed example; the figure is classical
    text: |-
      we go home
      they go home
    params: { closing: home }
    satisfied: true
  - name: broken-closing
    source: constructed counterexample
    text: |-
      we go home
      they go away
    params: { closing: home }
    satisfied: false
  - name: epistrophe-gettysburg
    lang: en
    provenance: external
    source: >-
      Abraham Lincoln, Gettysburg Address (19 November 1863); closing sentence (Bliss copy
      text)
    text: |-
      that government of the people, by the people, for the people,
      shall not perish from the earth.
    params: {closing: "the people", unit: "clause", minimum: 3}
    satisfied: true
