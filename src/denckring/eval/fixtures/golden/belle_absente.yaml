procedure: belle_absente
lang: en
cases:
  - name: two-letter-dedication
    source: >-
      constructed example; the form is Perec's, in Oulipo, Atlas de littérature
      potentielle (1981)
    text: |-
      b c d e f g h i j k l m n o p q r s t u v w x y z
      a c d e f g h i j k l m n o p q r s t u v w x y z
    params: { name: ab }
    satisfied: true
  - name: a-line-keeping-its-own-letter
    source: constructed counterexample
    text: |-
      banana
      banana
    params: { name: ab }
    satisfied: false
  - name: dedicace-a-deux-lettres
    lang: fr
    source: >-
      constructed example; the form is Perec's, in Oulipo, Atlas de littérature
      potentielle (1981). Letter-level, so the lines are the alphabet itself:
      what the French case exercises is the French pack's alphabet and
      tokenisation, not French wording.
    text: |-
      b c d e f g h i j k l m n o p q r s t u v w x y z
      a c d e f g h i j k l m n o p q r s t u v w x y z
    params: { name: ab }
    satisfied: true
  - name: une-ligne-garde-sa-lettre
    lang: fr
    source: constructed counterexample
    text: |-
      banane
      banane
    params: { name: ab }
    satisfied: false
  - name: widmung-an-jo
    lang: de
    source: >-
      constructed example; the form is Perec's, in Oulipo, Atlas de littérature
      potentielle (1981). Each line carries every letter but its own as a plain
      letter, so it holds with `fold_diacritics` on or off (ADR 0063)
    text: |-
      Quirlige Boxer winken typisch zum Fuchs, Delfin und Vogel am Strand.
      Jürgen quält vierzehn kleine Schafe, Max pflegt bei Sylt Wild.
    params: { name: Jo }
    satisfied: true
  - name: oe-ist-ein-o
    lang: de
    source: >-
      constructed counterexample; `ö` folds to `o`, so "Wölfe" breaks the line
      that must omit the `o` of "Jo"
    text: |-
      Quirlige Boxer winken typisch zum Fuchs, Delfin und Vogel am Strand.
      Jürgen quält vierzehn kleine Schafe, Max pflegt bei Sylt Wölfe und Wild.
    params: { name: Jo }
    satisfied: false
