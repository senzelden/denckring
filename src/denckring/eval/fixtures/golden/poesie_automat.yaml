procedure: poesie_automat
lang: de
cases:
  - name: eine-anzeige-die-der-automat-zeigen-kann
    source: >-
      constructed example; produced by spinning the board (seed 5), then checked.
      The seed was chosen rather than taken: no word stem repeats anywhere in the
      six lines, and no preposition heads more than three of the thirty-six
      flaps, so the case shows the board rather than an unlucky draw from it. The
      schema is Enzensberger's; the 360 fillers are original to this project, as
      the catalogue row and the device file both say.
    text: |-
      Am Ersten schrumpft das Amt mit Bedacht immer laut Ansage
      Der Asphalt im Regen über Land vermutlich auf Dauer laut Akte
      Hinter Glas altert die Kantine bekanntlich vor der Tür per Zufall
      Die Fabrik auf Antrag monatelang trotz Wind unter Last ab sofort
      Das Blech kreist anderswo vor Nässe vor Sonntag bei Hitze
      Freitags das Gerüst am Fenster im Abseits unentwegt aus Zement
    params: {}
    satisfied: true
  - name: eine-zweite-anzeige-die-keine-klappe-wiederholt
    source: >-
      constructed example; seed 82, chosen because all thirty-six of its modules
      show a different flap from the case above — so the pair covers 72 flaps
      rather than 30 twice — and because it repeats no word stem either. That
      disjointness is not taken on trust: the seed was found by segmenting
      candidate texts back to flap indices and comparing, and
      `test_the_two_positive_fixtures_share_no_flap` re-derives it from this file
      on every run rather than reading it here.
    text: |-
      Montags vergilbt das Werk gegen bar inzwischen über Nacht
      Die Ampel unter Eis am Zaun vielerorts bei Wind von Süden
      Im Depot schimmelt das Gleis zumeist unter Null in Sicht
      Der Turm ohne Zeugen sicherlich um drei bei Frost in Serie
      Die Fracht zittert erneut nach Bedarf auf Reisen gegen Hitze
      Abends das Tor auf Posten mit Glas mitunter ab Dienstag
    params: {}
    satisfied: true
  - name: ein-wort-das-auf-keiner-klappe-steht
    source: >-
      constructed counterexample; the first case with "die Kantine" in line 3
      replaced by "die Werkstatt", which stands on no flap of that module
    text: |-
      Am Ersten schrumpft das Amt mit Bedacht immer laut Ansage
      Der Asphalt im Regen über Land vermutlich auf Dauer laut Akte
      Hinter Glas altert die Werkstatt bekanntlich vor der Tür per Zufall
      Die Fabrik auf Antrag monatelang trotz Wind unter Last ab sofort
      Das Blech kreist anderswo vor Nässe vor Sonntag bei Hitze
      Freitags das Gerüst am Fenster im Abseits unentwegt aus Zement
    params: {}
    satisfied: false
    min_score: 0.8
    max_score: 0.9
  - name: eine-zeile-der-falschen-zeile-vorgelegt
    source: >-
      constructed counterexample; lines 1 and 5 of the first case swapped. Each
      is a line the board can show, but not in that position — the modules are
      per line, which is what makes the count a product of thirty-six tens
      rather than of six.
    text: |-
      Das Blech kreist anderswo vor Nässe vor Sonntag bei Hitze
      Der Asphalt im Regen über Land vermutlich auf Dauer laut Akte
      Hinter Glas altert die Kantine bekanntlich vor der Tür per Zufall
      Die Fabrik auf Antrag monatelang trotz Wind unter Last ab sofort
      Am Ersten schrumpft das Amt mit Bedacht immer laut Ansage
      Freitags das Gerüst am Fenster im Abseits unentwegt aus Zement
    params: {}
    satisfied: false
  - name: eine-zeile-zu-wenig
    source: constructed counterexample; the board has six rows and shows six
    text: |-
      Am Ersten schrumpft das Amt mit Bedacht immer laut Ansage
      Der Asphalt im Regen über Land vermutlich auf Dauer laut Akte
      Hinter Glas altert die Kantine bekanntlich vor der Tür per Zufall
      Die Fabrik auf Antrag monatelang trotz Wind unter Last ab sofort
      Das Blech kreist anderswo vor Nässe vor Sonntag bei Hitze
    params: {}
    satisfied: false
