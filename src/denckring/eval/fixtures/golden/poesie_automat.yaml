procedure: poesie_automat
lang: de
cases:
  - name: eine-anzeige-die-der-automat-zeigen-kann
    source: >-
      constructed example; produced by spinning the board (seed 0), then checked.
      The schema is Enzensberger's; the 360 fillers are original to this project,
      as the catalogue row and the device file both say.
    text: |-
      Um sieben gefriert der Wind gegen bar neuerdings laut Ansage
      Der Kies gegen Nässe laut Liste anscheinend vor Mittag aus Blech
      Im Schacht knistert das Gleis seitdem ohne Halt vor Gericht
      Der Hafen mit Kies zuweilen über Eck gegen Rost in Serie
      Die Straße gedeiht fortan mit Ansage in Reserve auf Umwegen
      Um sechs das Gelände vor dem Amt nach Wunsch vormals im Moor
    params: {}
    satisfied: true
  - name: eine-zweite-anzeige-die-keine-klappe-wiederholt
    source: >-
      constructed example; seed 8, chosen because all thirty-six of its modules
      show a different flap from the case above — so the pair covers 72 flaps
      rather than 30 twice. That disjointness is not taken on trust: the seed was
      found by segmenting candidate texts back to flap indices and comparing, and
      `test_the_two_positive_fixtures_share_no_flap` re-derives it from this file
      on every run rather than reading it here.
    text: |-
      Im Winter dröhnt die Halle unter Strom überall am Rand
      Die Brücke unter Eis aus Beton seither nach Frost ab Ostern
      Am Kanal rauscht das Moos vorerst seit Juni laut Gesetz
      Die Anzeige nach Antrag monatelang in Ketten bei Tag aus Glas
      Der Regen wartet scheinbar seit Herbst im Umlauf seit Beginn
      Nachts die Wache in Trümmern ohne Uhr hierzulande vor Montag
    params: {}
    satisfied: true
  - name: ein-wort-das-auf-keiner-klappe-steht
    source: >-
      constructed counterexample; the first case with "das Gleis" in line 3
      replaced by "das Stellwerk", which stands on no flap of that module
    text: |-
      Um sieben gefriert der Wind gegen bar neuerdings laut Ansage
      Der Kies gegen Nässe laut Liste anscheinend vor Mittag aus Blech
      Im Schacht knistert das Stellwerk seitdem ohne Halt vor Gericht
      Der Hafen mit Kies zuweilen über Eck gegen Rost in Serie
      Die Straße gedeiht fortan mit Ansage in Reserve auf Umwegen
      Um sechs das Gelände vor dem Amt nach Wunsch vormals im Moor
    params: {}
    satisfied: false
    min_score: 0.8
    max_score: 0.9
  - name: eine-zeile-der-falschen-zeile-vorgelegt
    source: >-
      constructed counterexample; lines 1 and 5 of the first case swapped. Each
      is a line the board can show, but not in that position — the modules are
      per line, which is what makes the count a product of thirty-six tens
      rather than of six.
    text: |-
      Die Straße gedeiht fortan mit Ansage in Reserve auf Umwegen
      Der Kies gegen Nässe laut Liste anscheinend vor Mittag aus Blech
      Im Schacht knistert das Gleis seitdem ohne Halt vor Gericht
      Der Hafen mit Kies zuweilen über Eck gegen Rost in Serie
      Um sieben gefriert der Wind gegen bar neuerdings laut Ansage
      Um sechs das Gelände vor dem Amt nach Wunsch vormals im Moor
    params: {}
    satisfied: false
  - name: eine-zeile-zu-wenig
    source: constructed counterexample; the board has six rows and shows six
    text: |-
      Um sieben gefriert der Wind gegen bar neuerdings laut Ansage
      Der Kies gegen Nässe laut Liste anscheinend vor Mittag aus Blech
      Im Schacht knistert das Gleis seitdem ohne Halt vor Gericht
      Der Hafen mit Kies zuweilen über Eck gegen Rost in Serie
      Die Straße gedeiht fortan mit Ansage in Reserve auf Umwegen
    params: {}
    satisfied: false
