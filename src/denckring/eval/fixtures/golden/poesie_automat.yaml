procedure: poesie_automat
lang: de
cases:
  - name: eine-anzeige-die-der-automat-zeigen-kann
    source: >-
      constructed example; produced by spinning the board (seed 0), then checked.
      The schema is Enzensberger's; the 360 fillers are original to this project,
      as the catalogue row and the device file both say.
    text: |-
      Kurz vor Ladenschluss dröhnt die Verwaltung bei Regen neuerdings an der Rampe
      Die Ampelanlage auf dem Dienstweg ohne Umschweife anscheinend zwischen Tür und Angel aus Rücksicht
      Neben dem Umspannwerk knistert der Rundfunk seitdem im Kreisverkehr vor dem Aufzug
      Der Aktenschrank bei laufendem Betrieb durchweg auf dem Hinterhof gegen Entgelt unter der Hand
      Der Asphalt gedeiht jahrzehntelang mit Sicherheitsabstand unter Vorbehalt des Widerrufs ohne Vorwarnung
      Kurz nach Mitternacht das Mischwasser zwischen zwei Anrufen gegen Ende der Woche demnächst in der Ablaufmappe
    params: {}
    satisfied: true
  - name: eine-zweite-anzeige-die-keine-klappe-wiederholt
    source: >-
      constructed example; seed 8, chosen because all thirty-six of its modules
      show a different flap from the case above — so the pair covers 72 flaps
      rather than 30 twice. That disjointness is not taken on trust: it was
      found by segmenting both texts back to flap indices and comparing, and
      `test_the_two_positive_fixtures_share_no_flap` re-derives it on every run.
      Seed 11 stood here first and shared six modules; the claim was wrong and
      the seed was replaced rather than the sentence quietly dropped.
    text: |-
      Jeden Montag schrumpft die Zufahrt im Nebel überall gegen Gebühr
      Der Winterdienst unter Zeitdruck in der Sackgasse seither ohne Anhörung trotz aller Einwände
      In den Vororten rauscht der Estrich tagelang seit dem Hochwasser seit der Zusammenlegung
      Die Nachfrage unter Auflagen stellenweise unter Umständen in der Vermittlung gegen jede Vernunft
      Die Volkszählung wartet vorübergehend seit der Übergabe in der Zulassungsstelle seit der Neuordnung
      Im Sommer der Sachbearbeiter unter Verdacht unter Volllast abschnittsweise zwischen zwei Aktenzeichen
    params: {}
    satisfied: true
