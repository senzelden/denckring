procedure: anagram
lang: en
cases:
  - name: listen-silent
    source: Traditional; the standard English example
    text: silent
    params: { source: listen }
    satisfied: true
  - name: not-an-anagram
    source: constructed counterexample
    text: silence
    params: { source: listen }
    satisfied: false
  - name: chien-niche
    lang: fr
    source: >-
      constructed example; this is what `apply("anagram", "chien", lang="fr")`
      returns now that the French pack carries `lexicon.graded_words` — the
      checker already ran in French, and this is the generation the capability
      adds.
    text: niche
    params: { source: chien }
    satisfied: true
  - name: une-lettre-en-trop
    lang: fr
    source: constructed counterexample; chiens carries a letter chien does not
    text: chiens
    params: { source: chien }
    satisfied: false

  - name: lebensmittel-mitbestellen
    lang: de
    source: >-
      generated by this row's own apply and checked back, 2026-09-04. A single
      word rearranging into a single word, which is the case worth leading with.
    text: mitbestellen
    params: { source: Lebensmittel }
    satisfied: true
  - name: taschenrechner-arche-sternchen
    lang: de
    source: generated by apply and checked back; the row German anagram exists for
    text: arche sternchen
    params: { source: Taschenrechner }
    satisfied: true
  - name: not-an-anagram-de
    lang: de
    source: >-
      constructed counterexample; the letters do not cover the source at all, so
      this fails on missing_letter and surplus_letter rather than on the lexicon
    text: esel lese
    params: { source: Lebensmittel }
    satisfied: false
  - name: right-anagram-wrong-source-de
    lang: de
    source: >-
      constructed counterexample; a real German anagram, checked against a source
      it is not an anagram of — the letters are the whole verdict here
    text: mitbestellen
    params: { source: Taschenrechner }
    satisfied: false
