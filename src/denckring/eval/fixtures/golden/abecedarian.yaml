procedure: abecedarian
lang: en
cases:
  - name: alphabet-of-lines
    source: constructed example; the form is ancient, see the catalogue entry
    text: |-
      Ash falls
      Birds go
      Cold comes
      Dusk stays
    params: { start: a }
    satisfied: true
  - name: out-of-order
    source: constructed counterexample
    text: |-
      Ash falls
      Cold comes
      Birds go
    params: { start: a }
    satisfied: false
  - name: umlaut-start
    lang: de
    source: >-
      constructed example; start="ö" folds to "o" (index 14) — the unfixed
      code fell back to index 0 and reported every line wrong, not vacuously
      right (ADR 0035)
    text: |-
      Ozean ruht
      Paradies wacht
      Quelle blinkt
    params: { start: ö }
    satisfied: true
