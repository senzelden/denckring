procedure: letter_bank
lang: en
cases:
  - name: drawn-from-the-bank
    source: constructed example; the form is described in Word Ways
    text: meander named
    params: { bank: meander }
    satisfied: true
  - name: strays-outside-the-bank
    source: constructed counterexample
    text: meander zoo
    params: { bank: meander }
    satisfied: false
  - name: aus-der-muehle
    lang: de
    source: >-
      constructed example; the bank's `ü` is matched by an `ü` in the text, never
      by a `u`, so the case does not lean on folding
    text: Mühe, Hülle, Mühle
    params: { bank: Mühle }
    satisfied: true
