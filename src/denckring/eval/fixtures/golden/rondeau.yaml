  - name: zwei-reime-und-rentrement
    lang: de
    source: "constructed example"
    text: |-
      der Sommer hält das Land
      die Ziegel liegen warm am Rand
      die Schwalbe kreuzt das Licht
      und keiner sagt warum sie spricht
      der Garten wartet an der Wand
      das Brot bleibt hinter jener Hand
      die Boote ziehen an den Strand
      die Möwe ruft und schweigt doch nicht
      der Sommer hält
      der Donner rollt und wird zum Brand
      die Kerze brennt am weißen Band
      der Wind geht fort mit dem Gedicht
      die Wahrheit zeigt ihr Gesicht
      die Ernte kehrt zurück zum Sand
      der Sommer hält
    params: { rentrement_words: 3 }
    satisfied: true
  - name: deux-rimes-et-rentrement
    lang: fr
    source: "constructed example"
    text: |-
      Sous le grand ciel s'étend l'amour
      Le temps s'écoule et dure toujours
      Il traversait un long chemin
      Il se levait tôt le matin
      Les fleurs se penchent tout autour
      Il espérait un prompt retour
      La nuit tombait douce et de velours
      Il s'endormait dans le jardin
      Sous le grand
      Le roi passait dans la cour
      Le peuple appelait au secours
      Chacun suivait son destin
      Le loup rôdait chez le voisin
      Le silence régnait alentour
      Sous le grand
    params: { rentrement_words: 3 }
    satisfied: true
