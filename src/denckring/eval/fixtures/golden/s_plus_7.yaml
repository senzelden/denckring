procedure: s_plus_7
lang: en
cases:
  - name: displaced-by-three
    source: constructed example; N+7 with the step left to the writer
    text: |-
      the catacala satanism on the tablefork
    params: { source: the cat sat on the table, offset: 3 }
    satisfied: true
  - name: wrong-offset
    source: constructed counterexample
    text: |-
      the catacala satanism on the tablefork
    params: { source: the cat sat on the table, offset: 7 }
    satisfied: false
  - name: german-displaced-by-three
    lang: de
    source: >-
      constructed example; computed by calling s_plus_7.check directly.
      Katze (noun_index 79197) and Tisch (noun_index 157569) are each
      displaced 3 entries forward in nouns() to Katzenauge and Tischblatt —
      verified against the lexicon and the procedure, not hand-written.
    text: |-
      Die Katzenauge schläft auf dem Tischblatt.
    params: { source: "Die Katze schläft auf dem Tisch.", offset: 3 }
    satisfied: true
  - name: german-non-noun-changed
    lang: de
    source: >-
      constructed counterexample; computed by calling s_plus_7.check directly.
      "Die" is changed to "Eine", a non-noun substitution the checker flags.
    text: |-
      Eine Katze schläft auf dem Tisch.
    params: { source: "Die Katze schläft auf dem Tisch.", offset: 3 }
    satisfied: false
  - name: francais-deplace-de-trois
    lang: fr
    source: >-
      constructed example; produced by `apply("s_plus_7", "le chat dort",
      lang="fr", offset=3)` rather than hand-written. chat (noun_index 7980) is
      displaced three entries forward in nouns() to chatière.
    text: |-
      le chatière dort
    params: { source: le chat dort, offset: 3 }
    satisfied: true
  - name: francais-mauvais-decalage
    lang: fr
    source: constructed counterexample; the same text read against an offset of 7, which chatière is not
    text: |-
      le chatière dort
    params: { source: le chat dort, offset: 7 }
    satisfied: false
  - name: elided-proclitic-displaced-by-three
    lang: fr
    source: >-
      constructed example; produced by `apply("s_plus_7", "l'île", lang="fr",
      offset=3)`. île (noun_index 44740) is displaced three entries forward
      in nouns() to îlot; the l' proclitic is not a noun and stays as it is —
      the seam ADR 0036 closes, where the whole token l'île was previously
      invisible to the noun index.
    text: l'îlot
    params: { source: l'île, offset: 3 }
    satisfied: true
  - name: elided-source-retyped-unchanged-under-strict
    lang: fr
    source: >-
      constructed counterexample; île is a listed noun left unchanged, which
      ambiguous_nouns="strict" exists to flag — the proclitic must not hide
      that behind an unfolded lookup
    text: l'île
    params: { source: l'île, offset: 3, ambiguous_nouns: strict }
    satisfied: false
