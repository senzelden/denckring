procedure: consonantal_lipogram
lang: en
cases:
  - name: avoids-the-set
    source: constructed example
    text: a real one
    params: { forbidden: bcd }
    satisfied: true
  - name: uses-the-set
    source: constructed counterexample
    text: a bad one
    params: { forbidden: bcd }
    satisfied: false
  - name: avoids-a-set-with-vowels
    source: >-
      constructed example; the set may hold vowels, which the lipogram suite of
      denckring-bench relies on (audit E3)
    text: I hold strong words, now lost.
    params: { forbidden: ae }
    satisfied: true
  - name: uses-a-vowel-of-the-set
    source: >-
      constructed counterexample; a vowel in the set fails like a consonant would
    text: I hold strong words, now lost again.
    params: { forbidden: ae }
    satisfied: false
  - name: evite-le-groupe
    lang: fr
    source: constructed example
    text: la lune se leva
    params: { forbidden: bcd }
    satisfied: true
  - name: emploie-le-groupe
    lang: fr
    source: constructed counterexample
    text: la bande se leva
    params: { forbidden: bcd }
    satisfied: false
  - name: cedille-repliee
    lang: fr
    source: >-
      constructed counterexample; `ç` folds to `c` like the text's letters, so
      the cedilla in "garçon" is forbidden (ADR 0035, D3)
    text: un garçon
    params: { forbidden: ç }
    satisfied: false
  - name: ohne-s-und-t
    lang: de
    source: constructed example
    text: Die Kühe weiden am grünen Hang
    params: { forbidden: st }
    satisfied: true
  - name: eszett-ist-ein-s
    lang: de
    source: >-
      constructed counterexample; `ß` folds to `ss`, so "großen" uses the
      forbidden `s` twice
    text: Die Kühe weiden am großen Hang
    params: { forbidden: st }
    satisfied: false
  # The German R-lipograms were sought and are not landed (2026-10-14), so this row has
  # no German external case. Gottlob Wilhelm Burmann (born Bormann), Gedichte ohne den
  # Buchstaben R. (Berlin: Kunze, 1788): scanned by GDZ Göttingen, PPN637703200,
  # images only, no text layer. His Einige Gedichte ohne den Buchstaben R (Berlin: Decker,
  # 1796), a different text from 1788's: SBB Berlin, PPN663105609, has an ALTO OCR layer,
  # but on "I. An Gott" alone it disagrees with the page image 13 times, including two
  # words lost and long s read as capital S; the preface admits "fünf oder sechs R" in
  # names. Dr. Franz Rittler, Die Zwillinge ... einen Roman ohne R (1st ed. Leipzig, preface
  # dated 1813; 2nd Wien, 1815; 3rd Wien: Härter, 1820): the 1820 edition is at the
  # ÖNB (viewer.onb.ac.at/106CFAF7) with Google OCR that disagrees with the print about
  # once in ten words on pp. 17-18 and invents r's the print does not have; no scan of the
  # 1815 edition was found. Correcting either OCR against the image would be retyping,
  # which ADR 0062 does not allow.
  - name: galaxy-1866-song-without-s
    provenance: external
    source: >-
      Anonymous song quoted in George Wakeman, "Tormenting the Alphabet", The Galaxy
      (New York: W. C. & F. P. Church), vol. 1, 1 July 1866, pp. 437-445, the song on
      p. 441. Wakeman introduces it as a "beautiful song, in which the obnoxious letter
      has no place", the letter being s, and names no author; on p. 438 he says many of
      the essay's examples "have been in print before". Anonymous, printed 1866 (ADR 0062,
      amended 2026-10-13); Wakeman died in March 1870, per the obituary "George Wakeman"
      in The Galaxy, May 1870 (archive.org sim_galaxy_1870-05_9_5). Archive.org
      sim_galaxy_1866-07-01_1, text layer
      https://archive.org/download/sim_galaxy_1866-07-01_1/sim_galaxy_1866-07-01_1_djvu.txt,
      extracted 2026-10-14 by script: the lines from "Oh! come to-night" through the third
      "Then come, love, come", blank lines dropped and whitespace collapsed, a space
      before ; ! : , closed up (the print sets a thin space there, which the OCR kept in
      "come ;"), and so is one after an opening quotation mark ("“ To-night");
      Wakeman's quotation marks (an opening one on each stanza, a closing one at the end)
      dropped as his quoting rather than the song's; a blank line after each refrain but
      the last, where the print breaks stanzas; curly apostrophes and the em dash as the
      text layer has them. Checked word
      for word against the page image,
      https://archive.org/download/sim_galaxy_1866-07-01_1/page/n68.jpg. The set is one
      letter, s, so the song is equally a single-letter lipogram. Selected: the essay's
      one quoted lipogram (Fulgentius's lipogrammatic prose and the poem Jami criticised
      are described, not quoted), and the checker accepts it, 1 of 1 screened.
    text: |-
      Oh! come to-night; for naught can charm
      The weary time when thou’rt away.
      Oh! come; the gentle moon hath thrown
      O’er bower and hall her quivering ray.
      The heather-bell hath mildly flung,
      From off her fairy leaf, the bright
      And diamond dew-drop that had hung
      Upon that leaf—a gem of light.
      Then come, love, come!

      To-night the liquid wave hath not—
      Illumined by the moonlit beam
      Playing upon the lake beneath,
      Like frolic in an Autumn dream—
      The liquid wave hath not, to-night,
      In all her moonlit pride, a fair
      Gift like to them that on thy lip
      Do breathe and laugh, and home it there.
      Then come, love, come!

      To-night! to-night! my gentle one,
      The flower-bearing Amra tree
      Doth long, with fragrant moan, to meet
      The love-lip of the honey-bee.
      But not the Amra tree can long
      To greet the bee, at evening light,
      With half the deep, fond love I long
      To meet my Nama here to-night.
      Then come, love, come!
    params: { forbidden: s }
    satisfied: true
