procedure: cinquain
lang: en
cases:
  - name: crapsey-measure
    source: constructed example; the 2-4-6-8-2 measure is Adelaide Crapsey's
    text: |-
      the cat
      sat on the mat
      the dog ran past the cat
      the cat sat on the mat and thought
      of mice
    params: {}
    satisfied: true
  - name: wrong-second-line
    source: constructed counterexample
    text: |-
      the cat
      sat
      the dog ran past the cat
      the cat sat on the mat and thought
      of mice
    params: {}
    satisfied: false
  - name: der-wind-im-schnee
    lang: de
    source: constructed example
    text: |-
      der Wind
      so kalt und klar
      der Wind zieht durch das Haus
      und trägt den Schnee über das Tor
      ganz still
    params: {}
    satisfied: true
  - name: mesure-de-crapsey
    lang: fr
    source: constructed example; the 2-4-6-8-2 measure is Adelaide Crapsey's
    text: |-
      le vent
      sur le jardin
      sur la vieille montagne
      et la pluie tombe sans bruit
      au loin
    params: {}
    satisfied: true
  - name: deuxieme-ligne-erronee
    lang: fr
    source: constructed counterexample
    text: |-
      le vent
      le jardin
      sur la vieille montagne
      et la pluie tombe sans bruit
      au loin
    params: {}
    satisfied: false
  - name: crapsey-november-night-cinquain
    source: >-
      Adelaide Crapsey, "November Night", from Verse (Rochester, NY: The
      Manas Press, 1915), published posthumously. The apostrophe in
      "frost-crisp'd" elides the -e of "crisped" and is load-bearing for the
      8-syllable fourth line (ADR 0040 D5): expand it and the count moves.
    text: |-
      Listen...
      With faint dry sound,
      Like steps of passing ghosts,
      The leaves, frost-crisp'd, break from the trees
      And fall.
    params: {}
    provenance: external
    satisfied: true
