procedure: pangrammatic_lipogram
lang: en
cases:
  - name: all-but-e
    source: constructed example
    text: abcdfghijklmnopqrstuvwxyz
    params: { forbidden: e }
    satisfied: true
  - name: contains-the-forbidden-letter
    source: constructed counterexample
    text: the quick brown fox jumps over the lazy dog
    params: { forbidden: e }
    satisfied: false
  - name: alle-bis-auf-umlaut-a
    lang: de
    source: >-
      constructed example; every base letter but "a", with forbidden="ä"
      folding to "a" (ADR 0035)
    text: bcdefghijklmnopqrstuvwxyz
    params: { forbidden: ä }
    satisfied: true
  - name: enthaelt-umlaut-a
    lang: de
    source: constructed counterexample; a full 26-letter pangram, "a" included
    text: abcdefghijklmnopqrstuvwxyz
    params: { forbidden: ä }
    satisfied: false
