procedure: word_ladder
lang: en
cases:
  - name: cold-to-warm
    source: Lewis Carroll's own example ladder, Doublets, a Word Puzzle (1879)
    text: |-
      cold cord card ward warm
    params: {}
    satisfied: true
  - name: two-letters-in-one-step
    source: constructed counterexample; card to warm changes two letters at once
    text: |-
      cold card warm
    params: {}
    satisfied: false
  - name: wald-zu-halt
    lang: de
    source: constructed example; the game itself is Carroll's, "Wortleiter" its established German name (already in this row's names)
    text: |-
      wald bald ball fall hall halt
    params: {}
    satisfied: true
  - name: zwei-buchstaben-in-einem-schritt
    lang: de
    source: constructed counterexample; wald to ball changes two letters at once
    text: |-
      wald ball halt
    params: {}
    satisfied: false
  - name: schon-zu-schoen-ungefaltet
    lang: de
    source: constructed example; the canonical German doublet, which only exists with folding off
    text: |-
      schon schön
    params: { fold_diacritics: false }
    satisfied: true
  - name: schon-zu-schoen-gefaltet
    lang: de
    source: constructed counterexample; folded, the two are the same word and no step happened
    text: |-
      schon schön
    params: {}
    satisfied: false
