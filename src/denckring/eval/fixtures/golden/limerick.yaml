procedure: limerick
lang: en
cases:
  - name: lear-beard
    provenance: external
    source: >-
      Edward Lear (d. 1888), The Book of Nonsense, limerick 1; Project Gutenberg ebook #982,
      https://www.gutenberg.org/cache/epub/982/pg982.txt, extracted by script 2026-10-12
      (the file names no edition or year; Lear first published A Book of Nonsense in 1846).
      Rejected: `identical_rhyme`. Lear ends the first and last lines on the same word,
      'beard', which strict practice counts a fault.
    text: |-
      There was an Old Man with a beard,
      Who said, "It is just as I feared!--
      Two Owls and a Hen,
      Four Larks and a Wren,
      Have all built their nests in my beard!"
    params: {}
    satisfied: false
  - name: lear-ryde
    provenance: external
    source: >-
      Edward Lear (d. 1888), The Book of Nonsense, limerick 2; Project Gutenberg ebook #982,
      https://www.gutenberg.org/cache/epub/982/pg982.txt, extracted by script 2026-10-14
      (the file names no edition or year; Lear first published A Book of Nonsense in 1846).
      Rejected: `identical_rhyme`. Lear ends the first and last lines on the same word,
      'Ryde', which strict practice counts a fault; the pronouncing dictionary does not
      carry the place name, so the repeat is judged by spelling.
    text: |-
      There was a Young Lady of Ryde,
      Whose shoe-strings were seldom untied;
      She purchased some clogs,
      And some small spotty dogs,
      And frequently walked about Ryde.
    params: {}
    satisfied: false
  - name: distinct-rhymes
    source: constructed example
    text: |-
      there was an old man with a beard
      who said it is just as i feared
      two owls and a hen
      four larks and a wren
      have all flown away and disappeared
    params: {}
    satisfied: true
  - name: aabba
    lang: de
    source: "constructed example"
    text: |-
      der Wandrer zieht durch jenes weite Land
      das Feuer brennt und wärmt die kalte Hand
      der Wandrer sieht ein Licht
      der Bote spricht es nicht
      die Blume welkt im Schatten an der Wand
    params: {}
    satisfied: true
  - name: aabba-fr
    lang: fr
    source: "constructed example"
    text: |-
      Il y avait un chat nommé Amour
      Qui cherchait le bonheur toujours
      Il prit un jour un chemin
      Et partit tôt le matin
      Et rêva de son retour
    params: {}
    satisfied: true
  - name: rime-b-rompue
    lang: fr
    source: "constructed counterexample"
    text: |-
      Il y avait un chat nommé Amour
      Qui cherchait le bonheur toujours
      Il prit un jour un chemin
      Et partit dans le froid gris
      Et rêva de son retour
    params: {}
    satisfied: false
