procedure: kangaroo_word
lang: en
cases:
  - name: encourage-urge
    source: the form's most cited example
    text: encourage
    params: { synonym: urge }
    satisfied: true
  - name: letters-out-of-order
    source: constructed counterexample
    text: encourage
    params: { synonym: rug }
    satisfied: false
  - name: fold-diacritics-on
    source: constructed counterexample
    text: cafés
    params: { synonym: cafe, fold_diacritics: true }
    satisfied: true
  - name: fold-diacritics-off
    source: constructed counterexample
    text: cafés
    params: { synonym: cafe, fold_diacritics: false }
    satisfied: false
  - name: souriant-riant
    lang: fr
    source: constructed example; riant is a word the lexicon knows and its letters run in order inside souriant
    text: |-
      souriant
    params: { synonym: riant }
    satisfied: true
  - name: lettres-presentes-mais-dans-le-desordre
    lang: fr
    source: >-
      constructed counterexample; every letter of train is present in souriant —
      so this fails on order alone, which is the constraint the case is here to
      exercise. Its predecessor claimed the same thing with triste, whose e is
      absent from souriant altogether, and so passed on letter absence rather
      than on ordering.
    text: |-
      souriant
    params: { synonym: train }
    satisfied: false
  - name: accented-synonym-under-default-folding
    lang: fr
    source: >-
      constructed example; écologie scatters école's letters in order and is
      itself a real, distinct word. is_word is not fold-aware — French keeps
      its accents on purpose — so a folded "ecole" never matched the table's
      "école" under default fold_diacritics (ADR 0036).
    text: écologie
    params: { synonym: école }
    satisfied: true
