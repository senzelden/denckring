procedure: pangrammatic_window
lang: en
cases:
  - name: pack-my-box
    provenance: external
    source: Traditional 32-letter pangram, in circulation by the early 20th century
    text: Pack my box with five dozen liquor jugs
    params: { max_length: 40 }
    satisfied: true
  - name: over-the-bar
    provenance: external
    source: The fox pangram, checked against a bar shorter than its own length
    text: The quick brown fox jumps over the lazy dog
    params: { max_length: 30 }
    satisfied: false
  - name: missing-several-letters
    source: constructed counterexample
    text: the quick brown fox
    params: { max_length: 100 }
    satisfied: false
  - name: empty-text-is-not-vacuous
    source: constructed counterexample
    text: ""
    params: { max_length: 100 }
    satisfied: false
    max_score: 0.0
  - name: juergen-und-max
    lang: de
    source: >-
      constructed example; every letter occurs unaccented at least once, so the
      window holds whether or not `ä` and `ü` fold
    text: Jürgen quält vierzehn kleine Schafe, Max pflegt bei Sylt Wild am Hof.
    params: { max_length: 80 }
    satisfied: true
