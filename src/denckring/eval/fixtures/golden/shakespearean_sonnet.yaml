procedure: shakespearean_sonnet
lang: en
cases:
  - name: three-quatrains-and-a-couplet
    source: constructed example; regular throughout, which real sonnets rarely are
    text: |-
      the cat can see the moon above the tree
      the dog will run across the field today
      a bird can fly around the house at three
      the sun will set behind the hill in may
      the fox will hide beneath the fallen stone
      the fish will swim beneath the frozen lake
      the owl will call across the dark alone
      the deer will wake before the morning break
      the moon will rise and fill the sky with light
      the horse will stand beside the gate so still
      the stars will burn until the end of night
      the mouse will hide behind the open till
      the clock will mark the passing of the time
      the bell will ring and slowly start to chime
    params: {}
    satisfied: true
  - name: too-few-lines
    source: constructed counterexample
    text: |-
      the cat can see the moon above the tree
      the dog will run across the field today
      a bird can fly around the house at three
      the sun will set behind the hill in may
      the fox will hide beneath the fallen stone
      the birds will sing before the break of day
    params: {}
    satisfied: false
  - name: unknown-word-mid-line
    source: constructed example; an invented word reaches the stress fallback
    text: |-
      blorf cat can see the moon above the tree
      the dog will run across the field today
      a bird can fly around the house at three
      the sun will set behind the hill in may
      the fox will hide beneath the fallen stone
      the fish will swim beneath the frozen lake
      the owl will call across the dark alone
      the deer will wake before the morning break
      the moon will rise and fill the sky with light
      the horse will stand beside the gate so still
      the stars will burn until the end of night
      the mouse will hide behind the open till
      the clock will mark the passing of the time
      the bell will ring and slowly start to chime
    params: {}
    satisfied: true
  - name: drei-quartette-und-couplet
    lang: de
    source: "constructed example"
    text: |-
      der Wandrer zieht durch jenes weite Land
      der Wind bewegt die Blätter in der Nacht
      das Feuer brennt und wärmt die kalte Hand
      der Regen fällt und niemand hat gelacht
      ein Vogel singt am Morgen auf dem Baum
      die Lampe steht und gibt uns wenig Licht
      ein Kind erwacht und ruft nach seinem Traum
      der Bote kommt, doch bringt er Botschaft nicht
      der Bauer geht am Abend nicht allein
      der Mond erhebt sich über jenem Feld
      die Sonne sinkt und lässt den Himmel rein
      die Krone fällt und niemand ist ein Held
      der Wandrer geht hinunter in das Tal
      die Fenster leuchten hell im großen Saal
    params: {}
    satisfied: true
  - name: shakespeare-sonnet-18
    source: >-
      William Shakespeare, Sonnets (1609), no. 18, based on Shake-speares
      Sonnets (London: Thomas Thorpe, 1609), the 1609 Quarto; original
      spelling, long-s normalised to s (ADR 0040 D5 — transcribed as printed,
      not modernised). Rejected: `temperate`/`date` is an Elizabethan rhyme
      this package's strict rhyme model does not accept (`does_not_rhyme`,
      ADR 0040 D3), the same pairing gives `wrong_stress` on "temperate"
      (100 vs expected 101), and three lines carrying 1609 spellings the
      pronouncing dictionary does not hold — "heauen", "vntrim'd",
      "wandr'st" — fall through to a fallback count that reads 9 syllables
      instead of 10 (`wrong_line_length`). Measured on this HEAD: score
      0.9615, 5 violations.
    text: |-
      Shall I compare thee to a Summers day?
      Thou art more louely and more temperate:
      Rough windes do shake the darling buds of Maie,
      And Sommers lease hath all too short a date:
      Sometime too hot the eye of heauen shines,
      And often is his gold complexion dimm'd,
      And euery faire from faire some-time declines,
      By chance, or natures changing course vntrim'd:
      But thy eternall Sommer shall not fade,
      Nor loose possession of that faire thou ow'st,
      Nor shall death brag thou wandr'st in his shade,
      When in eternall lines to time thou grow'st,
      So long as men can breathe or eyes can see,
      So long liues this, and this giues life to thee.
    params: {}
    provenance: external
    satisfied: false
