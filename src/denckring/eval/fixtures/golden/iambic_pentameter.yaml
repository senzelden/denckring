procedure: iambic_pentameter
lang: en
cases:
  - name: regular-lines
    source: constructed example; strict scansion admits no substitutions
    text: |-
      the cat can see the moon above the tree
      the dog will run across the field today
      a bird can fly around the house at three
      the sun will set behind the hill in may
    params: {}
    satisfied: true
  - name: wrong-length
    source: constructed counterexample
    text: |-
      the cat sat on the mat
    params: {}
    satisfied: false
  - name: unknown-word-mid-line
    source: constructed example; an invented word reaches the stress fallback
    text: |-
      blorf cat can see the moon above the tree
      the dog will run across the field today
      a bird can fly around the house at three
      the sun will set behind the hill in may
    params: {}
    satisfied: true
  - name: blankvers
    lang: de
    source: "constructed example; the German Blankvers is this measure"
    text: |-
      der Wandrer zieht durch jenes weite Land
      der Wind bewegt die Blätter in der Nacht
      ein Vogel singt am Morgen auf dem Baum
      die Lampe steht und gibt uns wenig Licht
    params: {}
    satisfied: true
  - name: zu-kurz
    lang: de
    source: "constructed counterexample"
    text: |-
      die Katze schläft
    params: {}
    satisfied: false
