  - name: aba-bcb-cdc
    lang: de
    source: "constructed example"
    text: |-
      der Wandrer zieht durch jenes weite Land
      der Wind bewegt die Blätter in der Nacht
      das Feuer brennt und wärmt die kalte Hand
      der Regen fällt und niemand hat gelacht
      ein Vogel singt am Morgen auf dem Baum
      die Glocke schlägt und alles ist vollbracht
      ein Kind erwacht und ruft nach seinem Traum
      die Lampe steht und gibt uns wenig Licht
      der Nebel füllt den stillen kalten Raum
    params: {}
    satisfied: true
  - name: aba-bcb-fr
    lang: fr
    source: "constructed example; the form of Dante's Commedia"
    text: |-
      Le vent emporte au loin tout notre amour
      Il traversait un long chemin
      Le temps s'efface et dure toujours
      Il se leva tôt le matin
      Il regardait au loin la montagne
      Puis s'en alla vers son jardin
    params: {}
    satisfied: true
  - name: rime-b-rompue
    lang: fr
    source: "constructed counterexample; the B rhyme (chemin/matin) breaks on the last line"
    text: |-
      Le vent emporte au loin tout notre amour
      Il traversait un long chemin
      Le temps s'efface et dure toujours
      Il se leva tôt le matin
