  - name: dante-inferno-canto1-sibbald
    source: >-
      Dante, Inferno, Canto I, lines 1-9; English terza-rima translation by
      James Romanes Sibbald, The Divine Comedy of Dante Alighieri (Edinburgh:
      David Douglas, 1884). Rejected: Sibbald's rhyme is genuinely
      interlocking (ABA BCB CDC) but two of its three chains rhyme on slant
      or eye-rhyme rather than a rhyme this package's strict model accepts —
      "renewed" does not rhyme with either "wood" or "understood", and
      "terrible" does not rhyme with "tell" or "befell" (`does_not_rhyme`,
      ADR 0040 D3). Measured on this HEAD: score 0.8889, 4 violations.
    text: |-
      In middle of the journey of our days
      I found that I was in a darksome wood—
      The right road lost and vanished in the maze.

      Ah me! how hard to make it understood
      How rough that wood was, wild, and terrible:
      By the mere thought my terror is renewed.

      More bitter scarce were death. But ere I tell
      At large of good which there by me was found,
      I will relate what other things befell.
    params: {}
    provenance: external
    satisfied: false
