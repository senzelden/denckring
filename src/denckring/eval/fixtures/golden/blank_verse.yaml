procedure: blank_verse
lang: en
cases:
  - name: unrhymed-pentameter
    source: constructed example; the form of Surrey's Aeneid (1554)
    text: |-
      the cat can see the moon above the tree
      the dog will run across the field today
      the fox will hide beneath the fallen stone
      the moon will rise behind the hill at nine
    params: {}
    satisfied: true
  - name: rhymed
    source: constructed counterexample; blank verse admits no rhyme at all
    text: |-
      the cat can see the moon above the tree
      the dog will run across the field today
      a bird can fly around the house at three
      the sun will set behind the hill in may
    params: {}
    satisfied: false
  - name: unknown-word-mid-line
    source: constructed example; an invented word reaches the stress fallback
    text: |-
      blorf cat can see the moon above the tree
      the dog will run across the field today
      the fox will hide beneath the fallen stone
      the moon will rise behind the hill at nine
    params: {}
    satisfied: true
  - name: vier-reimlose-zeilen
    lang: de
    source: "constructed example; unrhymed, which is what makes it blank"
    text: |-
      der Wandrer zieht durch jenes weite Land
      der Wind bewegt die Blätter in der Nacht
      ein Vogel singt am Morgen auf dem Baum
      die Lampe steht und gibt uns wenig Licht
    params: {}
    satisfied: true
  - name: gereimtes-paar
    lang: de
    source: "constructed counterexample; a rhyme is what blank verse must not have"
    text: |-
      der Wandrer zieht durch jenes weite Land
      das Feuer brennt und wärmt die kalte Hand
    params: {}
    satisfied: false
