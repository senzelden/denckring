procedure: senryu
lang: en
cases:
  - name: haiku-measure
    source: constructed example; the measure is the haiku's, the subject is not
    text: |-
      an old silent pond
      a frog jumps into the pond
      splash silence again
    params: {}
    satisfied: true
  - name: wrong-measure
    source: constructed counterexample
    text: |-
      an old silent pond
      a frog jumps in
      splash
    params: {}
    satisfied: false
  - name: niemand-sagt-ein-wort
    lang: de
    source: constructed example
    text: |-
      das Wasser klingt hell
      und niemand sagt ein Wort mehr
      ein alter Teich dort
    params: {}
    satisfied: true
  - name: mesure-du-haiku
    lang: fr
    source: constructed example; the measure is the haiku's, the subject is not
    text: |-
      un chat noir traverse
      le silence tombe enfin
      un vieux jardin dort
    params: {}
    satisfied: true
  - name: mauvaise-mesure
    lang: fr
    source: constructed counterexample
    text: |-
      un chat noir traverse
      le silence tombe
      un vieux
    params: {}
    satisfied: false
