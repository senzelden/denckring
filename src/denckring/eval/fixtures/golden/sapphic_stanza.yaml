procedure: sapphic_stanza
lang: en
cases:
  - name: constructed-satisfying-stanza
    source: >-
      constructed example; no literary English translation of Sappho was
      found to scan exactly against this fixed accentual pattern, so this
      case tiles the hendecasyllable and adonic from words of known stress.
    text: |-
      forest morning murmuring silver garden
      silver garden beautiful forest morning
      garden silver carefully morning forest
      wonderful garden
    satisfied: true
  - name: prose-of-similar-length
    source: constructed counterexample
    text: |-
      the cat sat on the small mat by the door
      a dog ran through the park and down the street
      a bird flew high above the old grey house
      the wind blew softly
    satisfied: false
  - name: empty-text-is-not-vacuous
    source: constructed counterexample
    text: ""
    satisfied: false
  - name: unknown-word-mid-line
    source: constructed example; an invented word reaches the stress fallback
    text: |-
      flurbish morning murmuring silver garden
      silver garden beautiful forest morning
      garden silver carefully morning forest
      wonderful garden
    params: {}
    satisfied: true
  - name: gefuegte-strophe
    lang: de
    source: "constructed example; tiles German words of known stress across the fixed pattern, the way the English case tiles English ones"
    text: |-
      Wald Oktober Abakus Wald Oktober
      Gold Gold Gold Gold Lexikon Gold Gold Gold Gold
      Blume Blume Blume Zitrone Blume
      Ostermond Garten
    params: {}
    satisfied: true
  - name: swinburne-sapphics-stanza-1
    provenance: external
    source: >-
      Algernon Charles Swinburne, "Sapphics", Poems and Ballads (first published 1866),
      stanza 1, from the London: William Heinemann printing of 1917 (first printed by
      Chatto, 1904). Project Gutenberg ebook #35402,
      https://www.gutenberg.org/cache/epub/35402/pg35402.txt, extracted 2026-10-12 by
      script, indentation removed. Swinburne died 1909. The poem's title names the form.
    text: |-
      All the night sleep came not upon my eyelids,
      Shed not dew, nor shook nor unclosed a feather,
      Yet with lips shut close and with eyes of iron
      Stood and beheld me.
    params: {}
    satisfied: true
  - name: swinburne-sapphics-stanza-2
    provenance: external
    source: >-
      Algernon Charles Swinburne, "Sapphics", Poems and Ballads (first published 1866),
      stanza 2, from the London: William Heinemann printing of 1917 (first printed by
      Chatto, 1904). Project Gutenberg ebook #35402,
      https://www.gutenberg.org/cache/epub/35402/pg35402.txt, extracted 2026-10-12 by
      script, indentation removed. Swinburne died 1909.
    text: |-
      Then to me so lying awake a vision
      Came without sleep over the seas and touched me,
      Softly touched mine eyelids and lips; and I too,
      Full of the vision,
    params: {}
    satisfied: true
