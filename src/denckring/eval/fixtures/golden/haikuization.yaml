procedure: haikuization
lang: en
cases:
  - name: line-ends-form-the-shorter-poem
    source: constructed example; the procedure is Oulipo's
    text: down fast high
    params:
      source: |-
        the cat sat down
        a dog ran fast
        one bird flew high
    satisfied: true
  - name: a-non-line-end-breaks-the-reading
    source: constructed counterexample
    text: cat fast high
    params:
      source: |-
        the cat sat down
        a dog ran fast
        one bird flew high
    satisfied: false
  - name: zeilenenden-bilden-das-kuerzere-gedicht
    lang: de
    source: constructed example; the procedure is Oulipo's
    text: tief schnell hoch
    params:
      source: |-
        die katze schlief tief
        ein hund lief schnell
        ein vogel flog hoch
    satisfied: true
  - name: kein-zeilenende-bricht-die-lesung
    lang: de
    source: constructed counterexample
    text: katze schnell hoch
    params:
      source: |-
        die katze schlief tief
        ein hund lief schnell
        ein vogel flog hoch
    satisfied: false
  - name: les-fins-de-vers-font-le-poeme
    lang: fr
    source: constructed example; the procedure is Oulipo's
    text: bien vite haut
    params:
      source: |-
        le chat dormait bien
        un chien courait vite
        un oiseau volait haut
    satisfied: true
  - name: un-mot-qui-ne-finit-pas-le-vers
    lang: fr
    source: constructed counterexample
    text: chat vite haut
    params:
      source: |-
        le chat dormait bien
        un chien courait vite
        un oiseau volait haut
    satisfied: false
