  - name: abababcc
    lang: de
    source: "constructed example"
    text: |-
      der Wandrer zieht durch jenes weite Land
      der Wind bewegt die Blätter in der Nacht
      das Feuer brennt und wärmt die kalte Hand
      der Regen fällt und niemand hat gelacht
      die Blume welkt im Schatten an der Wand
      die Glocke schlägt und alles ist vollbracht
      ein Vogel singt am Morgen auf dem Baum
      ein Kind erwacht und ruft nach seinem Traum
    params: {}
    satisfied: true
  - name: byron-don-juan-i-cxiii
    provenance: external
    source: >-
      Lord Byron, Don Juan, Canto I (1819), stanza CXIII, from The Works of Lord Byron,
      Poetry vol. VI, ed. Ernest Hartley Coleridge (London: John Murray, 1903). Project
      Gutenberg ebook #18762, https://www.gutenberg.org/cache/epub/18762/pg18762.txt,
      extracted 2026-10-12 by script, indentation removed. Byron died 1824, Coleridge
      1920. Selected: the checker rejects 215 of the 219 stanzas of Canto I as this
      edition prints them, and 191 of those have an eleven-syllable line, the length a
      feminine ending gives, which ottava rima allows (see the CHANGELOG).
    text: |-
      The sun set, and up rose the yellow moon:
      The Devil's in the moon for mischief; they
      Who called her CHASTE, methinks, began too soon
      Their nomenclature; there is not a day,
      The longest, not the twenty-first of June,
      Sees half the business in a wicked way,
      On which three single hours of moonshine smile--
      And then she looks so modest all the while!
    params: {}
    satisfied: true
  - name: byron-don-juan-i-cxix
    provenance: external
    source: >-
      Lord Byron, Don Juan, Canto I (1819), stanza CXIX, from The Works of Lord Byron,
      Poetry vol. VI, ed. Ernest Hartley Coleridge (London: John Murray, 1903). Project
      Gutenberg ebook #18762, https://www.gutenberg.org/cache/epub/18762/pg18762.txt,
      extracted 2026-10-12 by script; the editor's footnote call and the indentation are
      removed. Byron died 1824, Coleridge 1920. Selected: the checker rejects 215 of the
      219 stanzas of Canto I as this edition prints them, and 191 of those have an
      eleven-syllable line, the length a feminine ending gives, which ottava rima allows
      (see the CHANGELOG).
    text: |-
      Oh Pleasure! you're indeed a pleasant thing,
      Although one must be damned for you, no doubt:
      I make a resolution every spring
      Of reformation, ere the year run out,
      But somehow, this my vestal vow takes wing,
      Yet still, I trust, it may be kept throughout:
      I'm very sorry, very much ashamed,
      And mean, next winter, to be quite reclaimed.
    params: {}
    satisfied: true
