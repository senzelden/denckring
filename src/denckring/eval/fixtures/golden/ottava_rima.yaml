  - name: abababcc
    lang: de
    source: "constructed example"
    text: |-
      der Wandrer zieht durch jenes weite Land
      der Wind bewegt die Blätter in der Nacht
      das Feuer brennt und wärmt die kalte Hand
      der Regen fällt und niemand hat gelacht
      die Blume welkt im Schatten an der Wand
      die Glocke schlägt und alles ist vollbracht
      ein Vogel singt am Morgen auf dem Baum
      ein Kind erwacht und ruft nach seinem Traum
    params: {}
    satisfied: true
  - name: byron-don-juan-i-cxiii
    provenance: external
    source: >-
      Lord Byron, Don Juan, Canto I (1819), stanza CXIII, from The Works of Lord Byron,
      Poetry vol. VI, ed. Ernest Hartley Coleridge (London: John Murray, 1903). Project
      Gutenberg ebook #18762, https://www.gutenberg.org/cache/epub/18762/pg18762.txt,
      extracted 2026-10-12 by script, indentation removed. Byron died 1824, Coleridge
      1920. Selected: re-measured 2026-10-14, the checker rejects 219 of the 222
      stanzas of Canto I as this edition prints them, 196 of those with an
      eleven-syllable line, the length a feminine ending gives; with feminine_ending,
      which ottava rima allows, it still rejects 217, 185 of them on stress and 148 on
      rhyme (see the CHANGELOG).
    text: |-
      The sun set, and up rose the yellow moon:
      The Devil's in the moon for mischief; they
      Who called her CHASTE, methinks, began too soon
      Their nomenclature; there is not a day,
      The longest, not the twenty-first of June,
      Sees half the business in a wicked way,
      On which three single hours of moonshine smile--
      And then she looks so modest all the while!
    params: {}
    satisfied: true
  - name: byron-don-juan-i-cxix
    provenance: external
    source: >-
      Lord Byron, Don Juan, Canto I (1819), stanza CXIX, from The Works of Lord Byron,
      Poetry vol. VI, ed. Ernest Hartley Coleridge (London: John Murray, 1903). Project
      Gutenberg ebook #18762, https://www.gutenberg.org/cache/epub/18762/pg18762.txt,
      extracted 2026-10-12 by script; the editor's footnote call and the indentation are
      removed. Byron died 1824, Coleridge 1920. Selected: re-measured 2026-10-14, the
      checker rejects 219 of the 222 stanzas of Canto I as this edition prints them, 196
      of those with an eleven-syllable line, the length a feminine ending gives; with
      feminine_ending, which ottava rima allows, it still rejects 217, 185 of them on
      stress and 148 on rhyme (see the CHANGELOG).
    text: |-
      Oh Pleasure! you're indeed a pleasant thing,
      Although one must be damned for you, no doubt:
      I make a resolution every spring
      Of reformation, ere the year run out,
      But somehow, this my vestal vow takes wing,
      Yet still, I trust, it may be kept throughout:
      I'm very sorry, very much ashamed,
      And mean, next winter, to be quite reclaimed.
    params: {}
    satisfied: true
  - name: byron-don-juan-i-cxxxviii
    provenance: external
    source: >-
      Lord Byron, Don Juan, Canto I (1819), stanza CXXXVIII, from The Works of Lord
      Byron, Poetry vol. VI, ed. Ernest Hartley Coleridge (London: John Murray, 1903).
      Project Gutenberg ebook #18762, https://www.gutenberg.org/cache/epub/18762/pg18762.txt,
      extracted 2026-10-14 by script; the transcriber's underscores marking italic type
      and the indentation are removed. Byron died 1824, Coleridge 1920. Checked with
      feminine_ending: five of its lines close feminine (number, slumber, encumber,
      contagious, outrageous). Selected: the checker rejects 219 of the 222 stanzas of
      Canto I as this edition prints them by default and 217 with feminine_ending; this
      stanza and LXXV are the only two the switch admits. LXXV is not landed: it passes
      only because its last line is read at eleven syllables with "being" as two, where
      the metre elides it to one, so the switch admits it as a feminine close it is not.
    text: |-
      By this time Don Alfonso was arrived,
      With torches, friends, and servants in great number;
      The major part of them had long been wived,
      And therefore paused not to disturb the slumber
      Of any wicked woman, who contrived
      By stealth her husband's temples to encumber:
      Examples of this kind are so contagious,
      Were one not punished, all would be outrageous.
    params: {feminine_ending: true}
    satisfied: true
