procedure: univocalic
lang: en
cases:
  - name: bombaugh-e-univocalic
    source: C. C. Bombaugh, Gleanings for the Curious (1867)
    text: Persever, ye perfect men, ever keep these precepts ten.
    params: { vowel: e }
    satisfied: true
  - name: ordinary-prose
    source: constructed counterexample
    text: The cat sat on the mat.
    params: { vowel: e }
    satisfied: false
  - name: nur-e
    lang: de
    source: constructed example
    text: Der Retter der Fremden erkennt jeden Wert.
    params: { vowel: e }
    satisfied: true
  - name: gemischte-vokale
    lang: de
    source: constructed counterexample
    text: Der Wind trug die Blumen fort.
    params: { vowel: e }
    satisfied: false
  - name: umlaut-vowel-under-folding
    lang: de
    source: >-
      constructed example; the text side folded ä to a and the parameter did
      not, so vowel "ä" could not be satisfied at all (ADR 0035)
    text: Bäh
    params: { vowel: "ä" }
    satisfied: true
