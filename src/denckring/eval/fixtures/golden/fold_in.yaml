procedure: fold_in
lang: en
cases:
  - name: left-half-joined-to-right-half
    source: constructed example; the procedure is Burroughs and Gysin's fold-in
    text: |-
      alpha beta three four
      five six ten
    params:
      source: |-
        alpha beta gamma delta
        five six seven

        one two three four
        eight nine ten
    satisfied: true
  - name: unfolded-page-one-fails
    source: constructed counterexample
    text: |-
      alpha beta gamma delta
      five six seven
    params:
      source: |-
        alpha beta gamma delta
        five six seven

        one two three four
        eight nine ten
    satisfied: false
  - name: linke-haelfte-mit-rechter-haelfte-verbunden
    lang: de
    source: constructed example; the procedure is Burroughs and Gysin's fold-in
    text: |-
      eins zwei zehn elf
      fuenf sechs vierzehn
    params:
      source: |-
        eins zwei drei vier
        fuenf sechs sieben

        acht neun zehn elf
        zwoelf dreizehn vierzehn
    satisfied: true
  - name: ungefaltete-seite-eins-scheitert
    lang: de
    source: constructed counterexample
    text: |-
      eins zwei drei vier
      fuenf sechs sieben
    params:
      source: |-
        eins zwei drei vier
        fuenf sechs sieben

