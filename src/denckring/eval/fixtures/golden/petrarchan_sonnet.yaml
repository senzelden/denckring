  - name: oktett-und-sextett
    lang: de
    source: "constructed example"
    text: |-
      der Wandrer zieht durch jenes weite Land
      der Wind bewegt die Blätter in der Nacht
      der Regen fällt und niemand hat gelacht
      das Feuer brennt und wärmt die kalte Hand
      die Blume welkt im Schatten an der Wand
      die Glocke schlägt und alles ist vollbracht
      der Morgen kommt und hat den Tag gebracht
      die Welle rollt und stirbt am flachen Strand
      ein Vogel singt am Morgen auf dem Baum
      die Lampe steht und gibt uns wenig Licht
      der Bauer geht am Abend nicht allein
      ein Kind erwacht und ruft nach seinem Traum
      der Bote kommt, doch bringt er Botschaft nicht
      die Sonne sinkt und lässt den Himmel rein
    params: {}
    satisfied: true
  - name: milton-sonnet-xvi-when-i-consider
    provenance: external
    source: >-
      John Milton, Sonnet XVI ("When I consider how my light is spent"), one of the poems
      added in the 1673 edition, from The Poetical Works of John Milton, ed. H. C. Beeching
      (Oxford; preface dated 8 November 1899), which prints them in their original spelling.
      Project Gutenberg ebook #1745, https://www.gutenberg.org/cache/epub/1745/pg1745.txt,
      extracted 2026-10-14 by script; the editor's line number and the indentation are
      removed. Milton died 1674, Beeching 1919. Checked with initial_inversion and
      stress_shift (ADR 0065): line 10 opens on a reversed foot ("Either"), and line 13
      stresses "without" on its first syllable. Selected: the checker rejects all 97
      fourteen-line blocks of this edition and of Wordsworth's Poems in Two Volumes (1807;
      ebooks #8774 and #8824) by default, and all 97 with any one switch alone; with
      initial_inversion and stress_shift together, or with all four, it rejects 96, and
      this sonnet is the one it admits. "Cyriack, whose Grandsire" still fails on
      "superfluous", which the dictionary stresses on its first syllable and no switch
      moves.
    text: |-
      When I consider how my light is spent,
      E're half my days, in this dark world and wide,
      And that one Talent which is death to hide,
      Lodg'd with me useless, though my Soul more bent
      To serve therewith my Maker, and present
      My true account, least he returning chide,
      Doth God exact day-labour, light deny'd,
      I fondly ask; But patience to prevent
      That murmur, soon replies, God doth not need
      Either man's work or his own gifts, who best
      Bear his milde yoak, they serve him best, his State
      Is Kingly.  Thousands at his bidding speed
      And post o're Land and Ocean without rest:
      They also serve who only stand and waite.
    params: {initial_inversion: true, stress_shift: true}
    satisfied: true
