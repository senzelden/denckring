procedure: ghazal
lang: en
cases:
  - name: radif-and-qafia-held
    source: constructed example
    text: |-
      i cannot find the road tonight
      the lamps have all been slowed tonight
      the river takes another turn
      and leaves its heavy load tonight
      the letters that i never sent
      are lying in the code tonight
    params: {}
    satisfied: true
  - name: radif-dropped-on-the-last-line
    source: constructed counterexample
    text: |-
      i cannot find the road tonight
      the lamps have all been slowed tonight
      the river takes another turn
      and leaves its heavy load tonight
      the letters that i never sent
      are lying in the code today
    params: {}
    satisfied: false
  - name: radif-und-qafia
    lang: de
    source: "constructed example; `heut Nacht` is the radif, repeated at every closing"
    text: |-
      ich finde nicht den Weg im Wald heut Nacht
      die Lampen sind schon alle kalt heut Nacht
      der Fluss nimmt eine andre Wendung an
      und lässt sein schweres Wasser alt heut Nacht
    params: {}
    satisfied: true
  - name: radif-et-qafia
    lang: fr
    source: "constructed example; `encore` is the radif, repeated at every closing"
    text: |-
      Le vent se lève et je pleure encore
      La nuit s'installe et je pleure encore
      Le temps passe et rien ne change
      Il sent la douleur encore
      Le silence dure et s'étend
      Mon coeur bat de chaleur encore
    params: {}
    satisfied: true
  - name: radif-perdu-sur-la-derniere-ligne
    lang: fr
    source: "constructed counterexample; the last carrier line drops the radif"
    text: |-
      Le vent se lève et je pleure encore
      La nuit s'installe et je pleure encore
      Le temps passe et rien ne change
      Il sent la douleur encore
      Le silence dure et s'étend
      Mon coeur bat de chaleur toujours
    params: {}
    satisfied: false
  - name: ghazal-platen
    lang: de
    provenance: external
    source: >-
      August von Platen, Ghaselen (Erlangen: Heyder, 1821); text via
      gedichte-lyrik-online.de, not collated against the 1821 edition
    text: |-
      Wenn du sammelst goldne Trauben ein,
      Hüllen Reben dich in Lauben ein;
      Wenn am Hügel dich umfängt der Schlaf,
      Girren dich verliebte Tauben ein;
      Wenn du liebst, so stellen Engel sich,
      Die der Sorge dich berauben, ein;
    params: {unknown_rhyme: "free"}
    satisfied: true
