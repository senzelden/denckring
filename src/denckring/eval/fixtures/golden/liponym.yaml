procedure: liponym
lang: en
cases:
  - name: avoids-the-word
    source: constructed example
    text: a cat sat on the mat
    params: { forbidden: dog }
    satisfied: true
  - name: uses-the-word
    source: constructed counterexample
    text: a dog sat on the mat
    params: { forbidden: dog }
    satisfied: false
  - name: evite-le-mot
    lang: fr
    source: constructed example
    text: un chat dormait sur le tapis
    params: { forbidden: chien }
    satisfied: true
  - name: emploie-le-mot
    lang: fr
    source: constructed counterexample
    text: un chien dormait sur le tapis
    params: { forbidden: chien }
    satisfied: false
  - name: ohne-das-wort
    lang: de
    source: constructed example
    text: Der Dackel schläft vor der Tür.
    params: { forbidden: Hund }
    satisfied: true
  - name: mit-dem-wort
    lang: de
    source: constructed counterexample
    text: Der Hund schläft vor der Tür.
    params: { forbidden: Hund }
    satisfied: false
