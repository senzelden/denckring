procedure: chronogram
lang: en
cases:
  - name: numerals-total-the-year
    source: constructed example; the form is described in the catalogue entry
    text: LVX
    params: { year: 65 }
    satisfied: true
  - name: wrong-total
    source: constructed counterexample
    text: LVX
    params: { year: 100 }
    satisfied: false
  - name: chronogram-my-day-closed
    lang: en
    provenance: external
    source: >-
      'My Day Closed Is In Immortality' (on the death of Queen Elizabeth I, 1603). James
      Hilton, Chronograms, 5000 and More in Number (London: Elliot Stock, 1882), p. 9,
      archive.org chronograms5000m00hilt; transcribed from the page image (leaf n34), which
      corrects the archive.org OCR's misreadings ('1 he', 'JMy', 'MDCin'). The line is
      printed in small capitals with its date letters as full capitals: “The following has
      often been quoted as an example of a clever chronogram on the death of Queen
      Elizabeth. It really is a very bad one, for although it gives the year 1603, it can
      also be made to give a variety of dates up to 4204, by using the superfluous numeral
      letters which represent the extra quantity 2601— My Day Closed Is In Immortality. =
      1603 The pretext it has for appearing as a chronogram is that only the initial
      letters of the words are counted, and they come in natural sequence to form the date
      1603, expressed by the Roman numerals MDCIII.” Rejected: `wrong_total`. Every
      numeral letter counts, the superfluous ones included, and they total 4204, not 1603.
    text: |-
      My Day Closed Is In Immortality
    params: {fold_diacritics: True, year: 1603}
    satisfied: false
    min_score: 0.37
  - name: hilton-francis-goldsmith
    lang: en
    provenance: external
    source: >-
      The annotator's name on the title-page of 'Hugo Grotius, his Somphopaneas, or Joseph a
      Tragedy' (London; 'Somphopaneas' is Hilton's spelling), which Hilton says "has no date on the title-page beyond that which is
      thus chronographically expressed". James Hilton, Chronograms, 5000 and More in Number
      (London: Elliot Stock, 1882), p. 9, dated there "= 1652";
      https://archive.org/details/chronograms5000m00hilt/page/n34 (Hilton d. 1907).
      Transcribed from the page image 2026-10-12, because the archive.org OCR misreads the
      small capitals; small capitals are written lowercase and the full capitals that mark
      the date are kept. Every numeral letter counts, and they total 1652.
    text: |-
      franCIs goLDsMIth.
    params: {year: 1652}
    satisfied: true
  - name: hilton-last-night-of-december
    lang: en
    provenance: external
    source: >-
      The first of the two closing lines of an eight-line epitaph "to 'Mr. Thomas Walters,
      late schoolmaster of Christ-Church,'" in the short tract 'Hugo Grotius his
      consolatory oration to his father', translated by F. G., bound in the same volume
      (British Museum copy); Hilton: "The first chronogram line expresses the
      day of the month and marks the year". James Hilton, Chronograms, 5000 and More in
      Number (London: Elliot Stock, 1882), p. 9, dated there "= 1651";
      https://archive.org/details/chronograms5000m00hilt/page/n34 (Hilton d. 1907).
      Transcribed from the page image 2026-10-12; small capitals are written lowercase, the
      opening quotation mark is dropped. Every numeral letter counts, and they total 1651.
    text: |-
      the Last nIght of DeCeMber
    params: {year: 1651}
    satisfied: true
  - name: hilton-rested-from-all-his-labors
    lang: en
    provenance: external
    source: >-
      The second closing line of the same epitaph to Thomas Walters; Hilton: "the second
      quaintly expresses his death and marks also the year". James Hilton, Chronograms, 5000
      and More in Number (London: Elliot Stock, 1882), p. 9, dated there "= 1651";
      https://archive.org/details/chronograms5000m00hilt/page/n34 (Hilton d. 1907).
      Transcribed from the page image 2026-10-12; small capitals are written lowercase, the
      opening quotation mark is dropped. Every numeral letter counts, and they total 1651.
    text: |-
      he resteD froM aLL hIs Labors.
    params: {year: 1651}
    satisfied: true
  - name: hilton-tirol-rifle-target
    lang: de
    provenance: external
    source: >-
      Inscribed on a rifle target in a Tirol parish, procured by Oskar Frankfurter. Hilton
      prints it with others from that parish and says "Their composition, however, is
      frequently careless, little regard being paid to the necessity of avoiding superfluous
      letters. These, full of such faults, are inscribed on a rifle target". James Hilton,
      Chronograms, 5000 and More in Number (London: Elliot Stock, 1882), p. 87, dated there
      "= 1854"; https://archive.org/details/chronograms5000m00hilt/page/n112 (Hilton d.
      1907). Transcribed from the page image 2026-10-12; small capitals are written
      lowercase. Hilton's 1854 is the full capitals alone. Rejected: `wrong_total`. Every
      numeral letter counts, the superfluous ones included, and they total 5916, not 1854.
    text: |-
      sCharf avf die sCheIb in deM tIrolerLand
      sCharf avf dIe feInd am Donaustrand.
    params: {year: 1854}
    satisfied: false
