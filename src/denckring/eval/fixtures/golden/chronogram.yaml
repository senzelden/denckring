procedure: chronogram
lang: en
cases:
  - name: numerals-total-the-year
    source: constructed example; the form is described in the catalogue entry
    text: LVX
    params: { year: 65 }
    satisfied: true
  - name: wrong-total
    source: constructed counterexample
    text: LVX
    params: { year: 100 }
    satisfied: false
  - name: chronogram-my-day-closed
    lang: en
    provenance: external
    source: >-
      'My Day Closed Is In Immortality' (on the death of Queen Elizabeth I, 1603). James
      Hilton, Chronograms, 5000 and More in Number (London: Elliot Stock, 1882), p. 9,
      archive.org chronograms5000m00hilt; transcribed from the page image (leaf n34), which
      corrects the archive.org OCR's misreadings ('1 he', 'JMy', 'MDCin'). The line is
      printed in small capitals with its date letters as full capitals: “The following has
      often been quoted as an example of a clever chronogram on the death of Queen
      Elizabeth. It really is a very bad one, for although it gives the year 1603, it can
      also be made to give a variety of dates up to 4204, by using the superfluous numeral
      letters which represent the extra quantity 2601— My Day Closed Is In Immortality. =
      1603 The pretext it has for appearing as a chronogram is that only the initial
      letters of the words are counted, and they come in natural sequence to form the date
      1603, expressed by the Roman numerals MDCIII.” Rejected: `wrong_total`. Every
      numeral letter counts, the superfluous ones included, and they total 4204, not 1603.
    text: |-
      My Day Closed Is In Immortality
    params: {fold_diacritics: True, year: 1603}
    satisfied: false
    min_score: 0.37
