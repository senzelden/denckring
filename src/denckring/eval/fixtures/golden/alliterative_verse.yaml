procedure: alliterative_verse
lang: en
cases:
  - name: four-lines-of-three
    source: constructed example, echoing the alliterative long line of Piers Plowman
    text: |-
      in a summer season when soft was the sun
      i shaped me in shrouds as a shepherd were
      bright was the bank where the birds were bold
      in a wide wild wood i wandered west
    params: { minimum: 3 }
    satisfied: true
  - name: one-line-breaks-the-chain
    source: constructed counterexample
    text: |-
      in a summer season when soft was the sun
      i shaped me in shrouds as a shepherd were
      bright was the bank where the birds were bold
      the quiet evening came down slowly
    params: { minimum: 3 }
    satisfied: false
  - name: vier-zeilen-mit-drei-stabreimen
    lang: de
    source: constructed example; German Stabreim is the tradition this row's name already names
    text: |-
      wind und wellen wehten wild
      berge brachen brausend breit
      kalte klare quellen kamen
      sturm stand stark am strand
    params: { minimum: 3 }
    satisfied: true
  - name: eine-zeile-bricht-die-kette
    lang: de
    source: constructed counterexample
    text: |-
      wind und wellen wehten wild
      berge brachen brausend breit
      kalte klare quellen kamen
      der abend kam still herein
    params: { minimum: 3 }
    satisfied: false
