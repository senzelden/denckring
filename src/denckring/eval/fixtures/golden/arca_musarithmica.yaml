procedure: arca_musarithmica
lang: en
cases:
  - name: two-phrases-set-from-the-tablet
    source: >-
      constructed example with a synthetic tablet; the mechanism is Kircher's
      Musurgia Universalis (1650) book VIII, the patterns are not his
    text: |-
      5 3 1 3
      5 5 3 1 3 5
    params:
      source: "the cat sat down\nthe dog ran home to eat"
      pinakes: '{"tones": ["I", "II", "III"], "syntagmata": {"1": {"4": ["5 3 1 3", "1 3 5 3"], "6": ["5 5 3 1 3 5", "1 1 3 5 3 1"]}}}'
    satisfied: true
  - name: a-pattern-from-the-wrong-tablet
    source: >-
      constructed counterexample; the box is indexed by syllable count, so a
      four-syllable pattern will not set a six-syllable phrase
    text: |-
      5 3 1 3
      5 3 1 3
    params:
      source: "the cat sat down\nthe dog ran home to eat"
      pinakes: '{"tones": ["I", "II", "III"], "syntagmata": {"1": {"4": ["5 3 1 3", "1 3 5 3"], "6": ["5 5 3 1 3 5", "1 1 3 5 3 1"]}}}'
    satisfied: false
