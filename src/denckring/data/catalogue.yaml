# Catalogue of experimental writing procedures.
# Licence: CC BY 4.0. Each row carries its own source attribution.
procedures:
  - id: lipogram
    names: { en: Lipogram, de: Lipogramm, fr: Lipogramme }
    definitions:
      en: A text that omits a chosen letter of the alphabet entirely.
      de: Ein Text, der einen gewählten Buchstaben vollständig auslässt.
      fr: Un texte qui omet entièrement une lettre choisie.
    source: Georges Perec, La Disparition (1969)
    family: letter
    attribution: primary
    kind: restrictive
    languages: [en, de]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Write a passage that never uses the letter "e", in any case or accented form.

  - id: univocalic
    names: { en: Univocalic, de: Univokalisch, fr: Univocalisme }
    definitions:
      en: A text using only one of the vowels.
      de: Ein Text, der nur einen einzigen Vokal verwendet.
      fr: Un texte n'employant qu'une seule voyelle.
    source: C. C. Bombaugh, Gleanings for the Curious from the Harvest-Fields of Literature (1867)
    family: letter
    attribution: reference
    aliases: [monovocalism]
    kind: restrictive
    languages: [en, de]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Write a passage in which "e" is the only vowel that appears.

  - id: tautogram
    names: { en: Tautogram, de: Tautogramm, fr: Tautogramme }
    definitions:
      en: A text in which every word begins with the same letter.
      de: Ein Text, in dem jedes Wort mit demselben Buchstaben beginnt.
      fr: Un texte dont chaque mot commence par la même lettre.
    source: Hucbald of Saint-Amand, Ecloga de Calvis (c. 890)
    family: letter
    attribution: primary
    kind: restrictive
    languages: [en, de]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Write a passage in which every single word begins with the letter "p".

  - id: pangram
    names: { en: Pangram, de: Pangramm, fr: Pangramme }
    definitions:
      en: >-
        A text containing every letter of the alphabet at least once; a perfect
        pangram uses each exactly once.
      de: Ein Text, der jeden Buchstaben des Alphabets mindestens einmal enthält.
      fr: Un texte contenant chaque lettre de l'alphabet au moins une fois.
    source: Traditional; catalogued in Oulipo, Atlas de littérature potentielle (1981)
    family: letter
    attribution: traditional
    aliases: [holalphabetic sentence]
    kind: restrictive
    languages: [en, de]
    requires: [alphabet, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Write one sentence that uses every letter of the alphabet at least once.

  - id: heterogram
    names: { en: Heterogram, de: Heterogramm, fr: Hétérogramme }
    definitions:
      en: A text in which no letter is repeated.
      de: Ein Text, in dem sich kein Buchstabe wiederholt.
      fr: Un texte dans lequel aucune lettre ne se répète.
    source: Dmitri A. Borgmann, Language on Vacation (1965)
    family: letter
    attribution: reference
    aliases: [isogram]
    kind: restrictive
    languages: [en, de]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Write a phrase in which no letter of the alphabet appears more than once.

  - id: palindrome
    names: { en: Palindrome, de: Palindrom, fr: Palindrome }
    definitions:
      en: >-
        A text that reads identically forwards and backwards, ignoring case,
        spacing and punctuation.
      de: Ein Text, der vorwärts wie rückwärts gleich lautet.
      fr: Un texte qui se lit identiquement dans les deux sens.
    source: Attributed to Sotades of Maroneia (3rd century BC); revived by Oulipo
    family: letter
    attribution: traditional
    kind: restrictive
    languages: [en, de]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Write a sentence that reads the same backwards as forwards, letter by letter.

  - id: snowball
    names: { en: Snowball, de: Schneeball, fr: Boule de neige }
    definitions:
      en: A text in which each word is exactly one letter longer than the word before it.
      de: Ein Text, in dem jedes Wort genau einen Buchstaben länger ist als das vorige.
      fr: Un texte dont chaque mot compte une lettre de plus que le précédent.
    source: Ausonius, Technopaegnion (4th century); named in Oulipo, La Littérature potentielle (1973)
    family: letter
    attribution: reference
    aliases: [rhopalic]
    kind: restrictive
    languages: [en, de]
    requires: [tokens]
    deterministic: true
    prompt_hints:
      en: Write a sentence whose first word has one letter, the next two, the next three, and so on.

  - id: reverse_snowball
    names: { en: Reverse snowball, de: Umgekehrter Schneeball, fr: Boule de neige fondante }
    definitions:
      en: A text in which each word is exactly one letter shorter than the word before it.
      de: Ein Text, in dem jedes Wort genau einen Buchstaben kürzer ist als das vorige.
      fr: Un texte dont chaque mot compte une lettre de moins que le précédent.
    source: Oulipo, La Littérature potentielle (1973), as fonte de neige
    family: letter
    attribution: reference
    aliases: [melting snowball]
    kind: restrictive
    languages: [en, de]
    requires: [tokens]
    deterministic: true
    prompt_hints:
      en: Write a sentence whose words shrink by exactly one letter each, ending in a single letter.

  - id: prisoners_constraint
    names:
      en: Prisoner's constraint
      de: Gefangenenbeschränkung
      fr: Contrainte du prisonnier
    definitions:
      en: A text using no letter with an ascender or a descender, as though saving paper.
      de: Ein Text ohne Buchstaben mit Ober- oder Unterlänge.
      fr: Un texte sans lettre à hampe ni à jambage.
    source: Georges Perec, in Oulipo, Atlas de littérature potentielle (1981)
    family: letter
    attribution: primary
    kind: restrictive
    languages: [en, de]
    requires: [tokens, letter_shapes, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: >-
        Write using only letters that stay within the x-height — avoid b, d, f, g,
        h, j, k, l, p, q, t and y.

  - id: beau_present
    names: { en: Beau présent, de: Schönes Geschenk, fr: Beau présent }
    definitions:
      en: A text written using only the letters contained in a dedicatee's name.
      de: Ein Text, der nur die Buchstaben eines Widmungsnamens verwendet.
      fr: Un texte n'employant que les lettres du nom d'un dédicataire.
    source: Georges Perec and Jacques Roubaud, in Oulipo, Atlas de littérature potentielle (1981)
    family: letter
    attribution: primary
    aliases: [beautiful present]
    kind: restrictive
    languages: [en, de]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Write a dedication using only the letters that appear in the dedicatee's name.

  - id: acrostic
    names: { en: Acrostic, de: Akrostichon, fr: Acrostiche }
    definitions:
      en: A text whose initial letters, read down the lines, spell out a target word or phrase.
      de: Ein Text, dessen Anfangsbuchstaben ein Wort ergeben.
      fr: Un texte dont les initiales composent un mot.
    source: Lewis Carroll, A Boat Beneath a Sunny Sky (1871)
    family: letter
    attribution: traditional
    kind: restrictive
    languages: [en, de]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Write a poem whose lines begin with the letters of the target word, in order.

  - id: telestich
    names: { en: Telestich, de: Telestichon, fr: Télestiche }
    definitions:
      en: A text whose final letters, read down the lines, spell out a target word or phrase.
      de: Ein Text, dessen Endbuchstaben ein Wort ergeben.
      fr: Un texte dont les lettres finales composent un mot.
    source: George Puttenham, The Arte of English Poesie (1589)
    family: letter
    attribution: traditional
    aliases: [telestic]
    kind: restrictive
    languages: [en, de]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Write a poem whose lines end with the letters of the target word, in order.

  # ---------------------------------------------------------------------------
  # Catalogued only: sourced, described, not yet implemented. These are what
  # `denckring status` counts against, so the coverage metric measures a real gap.
  # ---------------------------------------------------------------------------

  - id: n_plus_7
    names: { en: N+7, de: N+7, fr: S+7 }
    definitions:
      en: Replace every noun with the seventh noun following it in a chosen dictionary.
      de: Jedes Substantiv wird durch das siebte folgende Substantiv im Wörterbuch ersetzt.
      fr: Remplacer chaque substantif par le septième qui le suit dans le dictionnaire.
    source: Jean Lescure, in Oulipo, La Littérature potentielle (1973)
    family: word
    attribution: primary
    aliases: [N+7]
    kind: both
    languages: [en]
    requires: [tokens, lexicon.nouns]
    deterministic: true
    prompt_hints:
      en: Replace each noun with the seventh noun after it in the dictionary, keeping everything else.

  - id: s_plus_7
    names: { en: S+7, de: S+7, fr: S+7 }
    definitions:
      en: N+7 generalised to any part of speech, displacing each by a fixed offset.
      de: N+7, verallgemeinert auf beliebige Wortarten.
      fr: S+7 généralisé à toute catégorie grammaticale.
    source: Oulipo, La Littérature potentielle (1973)
    family: word
    attribution: reference
    kind: both
    languages: [en]
    requires: [tokens, lexicon.nouns]
    deterministic: true
    prompt_hints:
      en: Displace every word of the chosen part of speech by a fixed number of dictionary entries.

  - id: anagram
    names: { en: Anagram, de: Anagramm, fr: Anagramme }
    definitions:
      en: A text using exactly the letters of another, rearranged.
      de: Ein Text aus genau den umgestellten Buchstaben eines anderen.
      fr: Un texte composé des lettres d'un autre, réordonnées.
    source: Attributed to Lycophron (3rd century BC); systematised by Oulipo
    family: word
    attribution: traditional
    kind: both
    languages: [en]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Rearrange all the letters of the source phrase into a new phrase, using each exactly once.

  - id: larding
    names: { en: Larding, de: Spicken, fr: Lardage }
    definitions:
      en: Insert a new sentence between every pair of existing sentences, repeatedly.
      de: Zwischen je zwei Sätze wird ein neuer eingefügt, wiederholt.
      fr: Insérer une phrase nouvelle entre chaque paire de phrases, itérativement.
    source: Oulipo, Atlas de littérature potentielle (1981)
    family: syntax
    attribution: reference
    kind: both
    languages: [en]
    requires: [tokens]
    deterministic: false
    prompt_hints:
      en: Between each pair of consecutive sentences, write a new sentence that connects them.

  - id: definitional_literature
    names:
      en: Definitional literature
      de: Definitionsliteratur
      fr: Littérature définitionnelle
    definitions:
      en: Replace each substantive word by its dictionary definition, and repeat.
      de: Jedes Inhaltswort wird durch seine Wörterbuchdefinition ersetzt, iterativ.
      fr: Remplacer chaque mot plein par sa définition, puis recommencer.
    source: Marcel Bénabou and Georges Perec, littérature définitionnelle (1966)
    family: word
    attribution: primary
    kind: both
    languages: [en]
    requires: [tokens, lexicon.nouns]
    deterministic: true
    prompt_hints:
      en: Replace every meaningful word with its dictionary definition, then do it again.

  - id: cut_up
    names: { en: Cut-up, de: Cut-up, fr: Cut-up }
    definitions:
      en: Cut a text into fragments and reassemble them in a new order.
      de: Ein Text wird zerschnitten und neu zusammengesetzt.
      fr: Découper un texte et le recomposer dans un ordre nouveau.
    source: Brion Gysin and William S. Burroughs, Minutes to Go (1960)
    family: procedural
    attribution: primary
    kind: constructive
    languages: [en]
    requires: [tokens]
    deterministic: false
    prompt_hints:
      en: Cut the passage into fragments and reassemble them in a different order.

  - id: fold_in
    names: { en: Fold-in, de: Fold-in, fr: Fold-in }
    definitions:
      en: Fold one page lengthwise onto another and read across the join.
      de: Eine Seite wird längs auf eine andere gefaltet und über den Falz gelesen.
      fr: Plier une page sur une autre et lire à travers la jointure.
    source: William S. Burroughs, The Third Mind (1978)
    family: procedural
    attribution: primary
    kind: constructive
    languages: [en]
    requires: [tokens]
    deterministic: false
    prompt_hints:
      en: Interleave the left half of one passage with the right half of another, line by line.

  - id: diastic
    names: { en: Diastic reading, de: Diastische Lesung, fr: Lecture diastique }
    definitions:
      en: Select words from a source whose nth letter matches the nth letter of a seed phrase.
      de: Wörter, deren n-ter Buchstabe dem n-ten Buchstaben eines Saatworts entspricht.
      fr: Choisir les mots dont la n-ième lettre correspond à celle d'une phrase-germe.
    source: Jackson Mac Low, Stanzas for Iris Lezak (1972)
    family: procedural
    attribution: primary
    kind: both
    languages: [en]
    requires: [tokens]
    deterministic: true
    prompt_hints:
      en: Walk the source text picking words whose nth letter matches the nth letter of the seed.

  - id: mesostic
    names: { en: Mesostic, de: Mesostichon, fr: Mésostiche }
    definitions:
      en: A spine word runs down the middle of the lines rather than the margin.
      de: Ein Wort läuft senkrecht durch die Mitte der Zeilen.
      fr: Un mot descend au milieu des vers plutôt qu'en marge.
    source: John Cage, Writing Through Finnegans Wake (1978)
    family: procedural
    attribution: primary
    aliases: [mesostich]
    kind: both
    languages: [en]
    requires: [tokens]
    deterministic: true
    prompt_hints:
      en: Arrange the lines so that the target word reads vertically down their middles.

  - id: syllable_count
    names: { en: Syllable count, de: Silbenzahl, fr: Compte syllabique }
    definitions:
      en: Every line has a prescribed number of syllables.
      de: Jede Zeile hat eine vorgeschriebene Silbenzahl.
      fr: Chaque vers compte un nombre de syllabes prescrit.
    source: Traditional prosody
    family: form
    attribution: traditional
    kind: restrictive
    languages: [en]
    requires: [tokens, syllables]
    deterministic: true
    prompt_hints:
      en: Write lines of exactly the given number of syllables each.

  - id: alexandrine
    names: { en: Alexandrine, de: Alexandriner, fr: Alexandrin }
    definitions:
      en: A twelve-syllable line with a caesura after the sixth.
      de: Ein zwölfsilbiger Vers mit Zäsur nach der sechsten Silbe.
      fr: Un vers de douze syllabes avec césure à l'hémistiche.
    source: French classical prosody; Jean Racine
    family: form
    attribution: traditional
    kind: restrictive
    languages: [fr]
    requires: [tokens, syllables]
    deterministic: true
    prompt_hints:
      en: Write twelve-syllable lines that break cleanly after the sixth syllable.

  - id: blank_verse
    names: { en: Blank verse, de: Blankvers, fr: Vers blanc }
    definitions:
      en: >-
        Verse in unrhymed iambic pentameter, holding the metre while dispensing
        with the rhyme that would otherwise mark the line ends.
      de: Reimloser fünfhebiger Jambus, der das Metrum ohne Reim trägt.
      fr: Vers en pentamètre iambique sans rime.
    source: Henry Howard, Earl of Surrey, translation of the Aeneid (1554)
    family: form
    attribution: primary
    kind: restrictive
    languages: [en]
    requires: [tokens, syllables]
    deterministic: true
    prompt_hints:
      en: Write unrhymed lines of five iambic feet each.

  - id: rhyme_scheme
    names: { en: Rhyme scheme, de: Reimschema, fr: Schéma de rimes }
    definitions:
      en: Line endings follow a prescribed pattern of rhymes.
      de: Die Zeilenenden folgen einem vorgegebenen Reimmuster.
      fr: Les fins de vers suivent un schéma de rimes prescrit.
    source: Traditional prosody
    family: form
    attribution: traditional
    kind: restrictive
    languages: [en]
    requires: [tokens, phonemes]
    deterministic: true
    prompt_hints:
      en: Write lines whose endings rhyme in the given pattern, for example ABAB.

  - id: sonnet
    names: { en: Sonnet, de: Sonett, fr: Sonnet }
    definitions:
      en: Fourteen lines in a fixed metre and rhyme scheme.
      de: Vierzehn Zeilen in festem Metrum und Reimschema.
      fr: Quatorze vers de mètre et de rimes fixés.
    source: Giacomo da Lentini, Sicilian School (c. 1230)
    family: form
    attribution: primary
    kind: restrictive
    languages: [en]
    requires: [tokens, syllables, phonemes]
    deterministic: true
    prompt_hints:
      en: Write fourteen lines in the given rhyme scheme and metre.

  - id: haiku
    names: { en: Haiku, de: Haiku, fr: Haïku }
    definitions:
      en: Three lines of five, seven and five syllables.
      de: Drei Zeilen mit fünf, sieben und fünf Silben.
      fr: Trois vers de cinq, sept et cinq syllabes.
    source: Matsuo Bashō (17th century); named as haiku by Masaoka Shiki (1892)
    family: form
    attribution: primary
    kind: restrictive
    languages: [en]
    requires: [tokens, syllables]
    deterministic: true
    prompt_hints:
      en: Write three lines of five, seven and five syllables.

  - id: terza_rima
    names: { en: Terza rima, de: Terzine, fr: Terza rima }
    definitions:
      en: Interlocking tercets rhyming ABA BCB CDC and so on.
      de: Verschränkte Terzinen mit dem Reimschema ABA BCB CDC.
      fr: Tercets enchaînés rimant ABA BCB CDC.
    source: Dante Alighieri, Commedia (c. 1320)
    family: form
    attribution: primary
    kind: restrictive
    languages: [en]
    requires: [tokens, phonemes]
    deterministic: true
    prompt_hints:
      en: Write three-line stanzas whose middle rhyme becomes the outer rhyme of the next.

  - id: denckring
    names:
      en: Denckring
      de: Fünffacher Denckring der Teutschen Sprache
      fr: Anneau combinatoire de Harsdörffer
    definitions:
      en: Five concentric rotating discs of word parts, combined into words by rotation.
      de: Fünf konzentrische Scheiben mit Wortteilen, die durch Drehung Wörter bilden.
      fr: Cinq disques concentriques de fragments, combinés par rotation.
    source: Georg Philipp Harsdörffer, Fünffacher Denckring der Teutschen Sprache (1651)
    family: permutation
    attribution: primary
    kind: constructive
    languages: [de]
    requires: [tokens, lexicon.syllables]
    deterministic: true
    prompt_hints:
      en: Combine a prefix, an initial, a medial, a final and a suffix into a candidate word.

  - id: proteus_verse
    names: { en: Proteus verse, de: Proteusvers, fr: Vers protée }
    definitions:
      en: A line whose words can be permuted into many metrically valid variants.
      de: Ein Vers, dessen Wörter zu vielen metrisch gültigen Varianten permutierbar sind.
      fr: Un vers dont les mots se permutent en de multiples variantes métriques.
    source: Julius Caesar Scaliger, Poetices libri septem (1561)
    family: permutation
    attribution: primary
    kind: constructive
    languages: [en]
    requires: [tokens]
    deterministic: true
    prompt_hints:
      en: Write a line whose words can be reordered freely while the metre still holds.

  - id: wechselsatz
    names: { en: Wechselsatz, de: Wechselsatz, fr: Vers permutatif }
    definitions:
      en: A permutational poem whose interchangeable words yield millions of variants.
      de: Ein Permutationsgedicht, dessen austauschbare Wörter Millionen Varianten ergeben.
      fr: Un poème permutatif aux millions de variantes.
    source: Quirinus Kuhlmann, Der Wechsel Menschlicher Sachen (1671)
    family: permutation
    attribution: primary
    kind: constructive
    languages: [de]
    requires: [tokens]
    deterministic: true
    prompt_hints:
      en: Write lines of interchangeable nouns and verbs that stay grammatical in any permutation.

  # ---------------------------------------------------------------------------
  # family: letter — procedures operating on individual characters
  # ---------------------------------------------------------------------------

  - id: belle_absente
    names: { en: Belle absente, fr: Belle absente }
    definitions:
      en: >-
        A poem with one line per letter of a dedicatee's name, each line omitting
        exactly that letter while using every other letter of the alphabet.
      fr: Un poème dont chaque vers omet une lettre du nom du dédicataire.
    source: Georges Perec, in Oulipo, Atlas de littérature potentielle (1981)
    family: letter
    attribution: primary
    aliases: [beautiful absent]
    kind: restrictive
    languages: [en]
    requires: [tokens, alphabet, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Write one line per letter of the name; each line omits that letter and uses all the others.

  - id: abecedarian
    names: { en: Abecedarian, de: Abecedarium, fr: Abécédaire }
    definitions:
      en: >-
        A text whose successive lines or words begin with successive letters of
        the alphabet, from A through to Z.
      de: Ein Text, dessen Zeilen mit aufeinanderfolgenden Buchstaben des Alphabets beginnen.
      fr: Un texte dont les vers commencent par les lettres successives de l'alphabet.
    source: Ancient Hebrew acrostic psalms; Lamentations
    family: letter
    attribution: traditional
    aliases: [abecedarius]
    kind: restrictive
    languages: [en]
    requires: [tokens, alphabet, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Write lines beginning with A, then B, then C, and so on to Z.

  - id: double_acrostic
    names: { en: Double acrostic }
    definitions:
      en: >-
        A text whose first and last letters each spell out a word when read down
        the lines, so the poem is bounded by two hidden strings.
    source: Traditional; described in the Renaissance rhetorical handbooks
    family: letter
    attribution: traditional
    aliases: [acrostic-telestich]
    kind: restrictive
    languages: [en]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Write lines whose initials spell one word and whose final letters spell another.

  - id: chronogram
    names: { en: Chronogram, de: Chronogramm, fr: Chronogramme }
    definitions:
      en: >-
        A phrase in which the letters that are also Roman numerals, read in order,
        sum to a significant date.
      de: Ein Satz, dessen als römische Ziffern lesbare Buchstaben eine Jahreszahl ergeben.
      fr: Une phrase dont les lettres-chiffres romains totalisent une date.
    source: Traditional; widespread in Latin inscriptions from the 15th century
    family: letter
    attribution: traditional
    kind: restrictive
    languages: [en]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Write a phrase whose Roman-numeral letters add up to the target year.

  - id: semordnilap
    names: { en: Semordnilap }
    definitions:
      en: >-
        A word or text that spells a different word when reversed, unlike a
        palindrome, which spells the same one.
    source: Dmitri A. Borgmann, Language on Vacation (1965)
    family: letter
    attribution: reference
    aliases: [emordnilap, reversible word]
    kind: restrictive
    languages: [en]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Find words that read as a different word backwards, such as stressed and desserts.

  - id: word_square
    names: { en: Word square, de: Wortquadrat, fr: Carré de mots }
    definitions:
      en: >-
        A grid of words of equal length reading the same across as down, so that
        row and column of the same index are identical.
      de: Ein Quadrat gleich langer Wörter, waagerecht wie senkrecht identisch lesbar.
      fr: Un carré de mots se lisant identiquement en lignes et en colonnes.
    source: Traditional; the Sator square is attested at Pompeii before 79 AD
    family: letter
    attribution: traditional
    kind: restrictive
    languages: [en]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Build a square of words that reads the same across each row as down each column.

  - id: pangrammatic_window
    names: { en: Pangrammatic window }
    definitions:
      en: >-
        A stretch of naturally occurring text, as short as possible, that happens
        to contain every letter of the alphabet.
    source: Word Ways, the Journal of Recreational Linguistics (1968 onwards)
    family: letter
    attribution: reference
    kind: restrictive
    languages: [en]
    requires: [alphabet, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Find the shortest run of ordinary prose containing all twenty-six letters.

  - id: supervocalic
    names: { en: Supervocalic }
    definitions:
      en: >-
        A word or text containing each of the five vowels exactly once, in any
        order.
    source: Word Ways, the Journal of Recreational Linguistics (1968 onwards)
    family: letter
    attribution: reference
    kind: restrictive
    languages: [en]
    requires: [tokens, alphabet, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Use words containing a, e, i, o and u exactly once each.

  - id: monoconsonantal
    names: { en: Monoconsonantal }
    definitions:
      en: >-
        A text using only one consonant throughout, the vowels being left
        unconstrained — the mirror image of the univocalic.
    source: Word Ways, the Journal of Recreational Linguistics (1968 onwards)
    family: letter
    attribution: reference
    kind: restrictive
    languages: [en]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Write a passage in which the only consonant that appears is "n".

  - id: consonantal_lipogram
    names: { en: Consonantal lipogram }
    definitions:
      en: >-
        A lipogram whose forbidden set is a group of consonants rather than a
        single letter.
    source: Oulipo, Atlas de littérature potentielle (1981)
    family: letter
    attribution: reference
    kind: restrictive
    languages: [en]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Write a passage avoiding every one of a named group of consonants.

  - id: liponym
    names: { en: Liponym }
    definitions:
      en: >-
        A text that omits a chosen word entirely, especially one the subject makes
        almost unavoidable.
    source: Oulipo, Atlas de littérature potentielle (1981)
    family: letter
    attribution: reference
    kind: restrictive
    languages: [en]
    requires: [tokens]
    deterministic: true
    prompt_hints:
      en: Describe the subject at length without ever using its most obvious word.

  - id: charade
    names: { en: Charade, de: Scharade, fr: Charade }
    definitions:
      en: >-
        A word that divides into two or more shorter words, used as the hinge of a
        riddle or a line.
      de: Ein Wort, das sich in kürzere Wörter zerlegen lässt.
      fr: Un mot qui se décompose en plusieurs mots plus courts.
    source: Traditional; a staple of 18th-century French and English parlour verse
    family: letter
    attribution: traditional
    kind: restrictive
    languages: [en]
    requires: [tokens]
    deterministic: true
    prompt_hints:
      en: Choose words that split cleanly into smaller words and build the line around them.

  - id: kangaroo_word
    names: { en: Kangaroo word }
    definitions:
      en: >-
        A word containing the letters of a synonym of itself, in order but not
        necessarily adjacent.
    source: Word Ways, the Journal of Recreational Linguistics (1968 onwards)
    family: letter
    attribution: reference
    aliases: [marsupial word]
    kind: restrictive
    languages: [en]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Find words that carry a synonym of themselves inside their own letters, in order.

  - id: tautonym
    names: { en: Tautonym }
    definitions:
      en: >-
        A word made of the same sequence of letters repeated twice, such as
        tartar or couscous.
    source: Dmitri A. Borgmann, Language on Vacation (1965)
    family: letter
    attribution: reference
    kind: restrictive
    languages: [en]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Use words built from one syllable-string written twice over.

  - id: paragram
    names: { en: Paragram, de: Paragramm, fr: Paragramme }
    definitions:
      en: >-
        A text built by changing a single letter of a word to produce another,
        turning the alteration into the point of the line.
      de: Ein Text, der durch Austausch eines einzigen Buchstabens neue Wörter gewinnt.
      fr: Un texte jouant sur le changement d'une seule lettre.
    source: Traditional; a classical rhetorical figure
    family: letter
    attribution: traditional
    kind: both
    languages: [en]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Change one letter of a word to make another, and build the sentence on the swap.

  - id: pangrammatic_lipogram
    names: { en: Pangrammatic lipogram }
    definitions:
      en: >-
        A text using every letter of the alphabet except one, which is omitted
        entirely — a pangram and a lipogram at once.
    source: Word Ways, the Journal of Recreational Linguistics (1968 onwards)
    family: letter
    attribution: reference
    kind: restrictive
    languages: [en]
    requires: [alphabet, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Write a sentence using all twenty-five letters other than the one you have banned.

  - id: bivocalic
    names: { en: Bivocalic }
    definitions:
      en: A text restricted to two of the vowels, the rest being excluded throughout.
    source: Word Ways, the Journal of Recreational Linguistics (1968 onwards)
    family: letter
    attribution: reference
    kind: restrictive
    languages: [en]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Write a passage using only the vowels "a" and "e".

  - id: antigram
    names: { en: Antigram }
    definitions:
      en: >-
        An anagram whose rearrangement means the opposite of its source, so the
        letters contradict themselves.
    source: Word Ways, the Journal of Recreational Linguistics (1968 onwards)
    family: letter
    attribution: reference
    kind: restrictive
    languages: [en]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Rearrange the phrase into one that means its opposite, using every letter once.

  - id: letter_bank
    names: { en: Letter bank }
    definitions:
      en: >-
        A text drawing only on the letters of a chosen source word, each of which
        must appear at least once and may repeat freely.
    source: Word Ways, the Journal of Recreational Linguistics (1968 onwards)
    family: letter
    attribution: reference
    kind: restrictive
    languages: [en]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Write using only the letters of the source word, using every one of them at least once.

  - id: transposal
    names: { en: Transposal }
    definitions:
      en: >-
        A pair of words using exactly the same letters in a different order,
        treated as a unit of composition rather than a puzzle.
    source: Dmitri A. Borgmann, Language on Vacation (1965)
    family: letter
    attribution: reference
    kind: restrictive
    languages: [en]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Pair each word with another built from exactly its letters, reordered.

  - id: eodermdrome
    names: { en: Eodermdrome }
    definitions:
      en: >-
        A word whose letters, read as the edges of a graph, trace a closed figure
        crossing every edge once.
    source: Dmitri A. Borgmann, Language on Vacation (1965)
    family: letter
    attribution: reference
    kind: restrictive
    languages: [en]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Find words whose letter pairs trace a closed graph without repeating an edge.

  - id: homoteleuton
    names: { en: Homoteleuton, de: Homoioteleuton, fr: Homéotéleute }
    definitions:
      en: >-
        A passage in which successive words or clauses end with the same letter or
        syllable, the mirror of the tautogram's shared initials.
      de: Ein Text, dessen aufeinanderfolgende Wörter gleich enden.
      fr: Un texte dont les mots successifs se terminent de la même façon.
    source: Traditional; a classical rhetorical figure described by Quintilian
    family: letter
    attribution: traditional
    kind: restrictive
    languages: [en]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Write a passage in which every word ends with the same letter.

  - id: alphabetical_sentence
    names: { en: Alphabetical sentence }
    definitions:
      en: >-
        A sentence whose words appear in alphabetical order from first to last,
        without rearrangement.
    source: Word Ways, the Journal of Recreational Linguistics (1968 onwards)
    family: letter
    attribution: reference
    kind: restrictive
    languages: [en]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Write a sentence whose words run in alphabetical order.

  # ---------------------------------------------------------------------------
  # families: word and syntax — procedures operating on words and on structure
  # ---------------------------------------------------------------------------

  - id: homoconsonantism
    names: { en: Homoconsonantism, fr: Homoconsonantisme }
    definitions:
      en: >-
        A rewriting that keeps the consonants of the source text in their original
        order while replacing every vowel, producing a new sense from the same skeleton.
      fr: Une réécriture conservant les consonnes du texte source et changeant les voyelles.
    source: Jacques Roubaud, in Oulipo, Atlas de littérature potentielle (1981)
    family: word
    attribution: primary
    kind: both
    languages: [en]
    requires: [tokens, fold_diacritics]
    deterministic: false
    prompt_hints:
      en: Keep the consonants of the source in order and choose new vowels to make new words.

  - id: homovocalism
    names: { en: Homovocalism, fr: Homovocalisme }
    definitions:
      en: >-
        The mirror of homoconsonantism: the vowels of the source are preserved in
        order and the consonants are replaced.
      fr: Une réécriture conservant les voyelles du texte source.
    source: Oulipo, Atlas de littérature potentielle (1981)
    family: word
    attribution: reference
    kind: both
    languages: [en]
    requires: [tokens, fold_diacritics]
    deterministic: false
    prompt_hints:
      en: Keep the vowels of the source in order and choose new consonants around them.

  - id: homosyntaxism
    names: { en: Homosyntaxism, fr: Homosyntaxisme }
    definitions:
      en: >-
        A rewriting that keeps the grammatical structure of the source intact,
        substituting new words of the same part of speech throughout.
      fr: Une réécriture conservant la syntaxe du texte source.
    source: Oulipo, Atlas de littérature potentielle (1981)
    family: syntax
    attribution: reference
    kind: both
    languages: [en]
    requires: [tokens]
    deterministic: false
    prompt_hints:
      en: Keep the sentence structure exactly and replace each word with another of the same class.

  - id: perverb
    names: { en: Perverb }
    definitions:
      en: >-
        A proverb formed by grafting the first half of one saying onto the second
        half of another, and the writing that follows from it.
    source: Harry Mathews, in Oulipo, Atlas de littérature potentielle (1981)
    family: word
    attribution: primary
    kind: both
    languages: [en]
    requires: [tokens]
    deterministic: false
    prompt_hints:
      en: Cross two proverbs at the midpoint and write the passage the hybrid implies.

  - id: mathews_algorithm
    names: { en: Mathews's algorithm }
    definitions:
      en: >-
        A permutation in which elements of several texts are arranged in a table
        and each column is rotated by a different amount before being read across.
    source: Harry Mathews, in Oulipo, Atlas de littérature potentielle (1981)
    family: word
    attribution: primary
    kind: constructive
    languages: [en]
    requires: [tokens]
    deterministic: true
    prompt_hints:
      en: Arrange the texts in a grid, rotate each column by one more step, and read across.

  - id: chimera
    names: { en: Chimera, fr: Chimère }
    definitions:
      en: >-
        A text whose nouns, verbs and adjectives are stripped out and replaced by
        those of three different source texts.
      fr: Un texte dont les substantifs, verbes et adjectifs viennent de trois sources différentes.
    source: Oulipo, Atlas de littérature potentielle (1981)
    family: word
    attribution: reference
    kind: constructive
    languages: [en]
    requires: [tokens, lexicon.nouns]
    deterministic: false
    prompt_hints:
      en: Empty the text of its nouns, verbs and adjectives and refill each class from a different source.

  - id: canada_dry
    names: { en: Canada Dry }
    definitions:
      en: >-
        A text with the manner of a constrained work but no constraint actually
        operating — it looks like the thing without being it.
    source: Oulipo, Atlas de littérature potentielle (1981)
    family: word
    attribution: reference
    kind: constructive
    languages: [en]
    requires: [tokens]
    deterministic: false
    prompt_hints:
      en: Write something that reads as though a strict rule governs it, while following none.

  - id: slenderizing
    names: { en: Slenderizing }
    definitions:
      en: >-
        A rewriting in which every instance of one letter is deleted, the
        surviving letters closing up into new words.
    source: Oulipo, Atlas de littérature potentielle (1981)
    family: word
    attribution: reference
    aliases: [elementary morphological deletion]
    kind: both
    languages: [en]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Delete every "r" from the passage and read what the remaining letters now say.

  - id: haikuization
    names: { en: Haikuization, fr: Haïkuisation }
    definitions:
      en: >-
        A reduction that keeps only the rhyme-words or line ends of an existing
        poem, leaving a shorter poem inside the longer one.
      fr: Une réduction ne gardant que les rimes d'un poème existant.
    source: Oulipo, La Littérature potentielle (1973)
    family: word
    attribution: reference
    kind: both
    languages: [en]
    requires: [tokens]
    deterministic: true
    prompt_hints:
      en: Keep only the rhyming words of each line and present what remains as the poem.

  - id: word_ladder
    names: { en: Word ladder, de: Wortleiter, fr: Échelle de mots }
    definitions:
      en: >-
        A chain of words in which each step changes exactly one letter of the word
        before it, every step being itself a word.
      de: Eine Kette von Wörtern, die sich jeweils um einen Buchstaben unterscheiden.
      fr: Une chaîne de mots différant chacun d'une seule lettre du précédent.
    source: Lewis Carroll, Doublets, a Word Puzzle (1879)
    family: word
    attribution: primary
    aliases: [doublets, word golf]
    kind: both
    languages: [en]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Move from the first word to the last, changing one letter at a time, each step a real word.

  - id: snowball_sentence
    names: { en: Snowball sentence }
    definitions:
      en: >-
        A snowball extended to whole sentences, each one carrying exactly one more
        word than the sentence before it.
    source: Word Ways, the Journal of Recreational Linguistics (1968 onwards)
    family: word
    attribution: reference
    kind: restrictive
    languages: [en]
    requires: [tokens]
    deterministic: true
    prompt_hints:
      en: Write sentences of one word, then two, then three, and so on.

  - id: monosyllabic_prose
    names: { en: Monosyllabic prose, de: Einsilbige Prosa }
    definitions:
      en: A text in which every word is of one syllable, from first to last.
      de: Ein Text, in dem jedes Wort einsilbig ist.
    source: Traditional; a standing exercise in English rhetorical instruction
    family: word
    attribution: traditional
    kind: restrictive
    languages: [en]
    requires: [tokens, syllables]
    deterministic: true
    prompt_hints:
      en: Write a passage in which no word has more than one syllable.

  - id: verbless_prose
    names: { en: Verbless prose }
    definitions:
      en: >-
        A text written without any finite verb, so that everything must be carried
        by nouns, participles and apposition.
    source: Oulipo, Atlas de littérature potentielle (1981)
    family: syntax
    attribution: reference
    kind: restrictive
    languages: [en]
    requires: [tokens]
    deterministic: true
    prompt_hints:
      en: Describe the scene without using a single finite verb.

  - id: single_sentence
    names: { en: Single sentence }
    definitions:
      en: >-
        A work consisting of exactly one sentence, however long, with no full stop
        until the end.
    source: Traditional; the form of Gertrude Stein's and Thomas Bernhard's long prose
    family: syntax
    attribution: traditional
    kind: restrictive
    languages: [en]
    requires: [tokens]
    deterministic: true
    prompt_hints:
      en: Write the whole piece as one unbroken sentence.

  - id: sentence_length_constraint
    names: { en: Sentence length constraint }
    definitions:
      en: >-
        A text whose sentences must each fall within a prescribed number of words,
        exactly or as a bound.
    source: Traditional; standard in style manuals and readability work
    family: syntax
    attribution: traditional
    kind: restrictive
    languages: [en]
    requires: [tokens]
    deterministic: true
    prompt_hints:
      en: Write so that every sentence contains exactly the given number of words.

  - id: anaphora
    names: { en: Anaphora, de: Anapher, fr: Anaphore }
    definitions:
      en: >-
        A text in which successive clauses or lines open with the same word or
        phrase, the repetition carrying the structure.
      de: Ein Text, dessen Sätze mit demselben Wort beginnen.
      fr: Un texte dont les propositions commencent par le même mot.
    source: Traditional; a classical rhetorical figure
    family: syntax
    attribution: traditional
    kind: restrictive
    languages: [en]
    requires: [tokens]
    deterministic: true
    prompt_hints:
      en: Begin every clause with the same word or phrase.

  - id: epistrophe
    names: { en: Epistrophe, de: Epipher, fr: Épiphore }
    definitions:
      en: >-
        The counterpart of anaphora: successive clauses or lines all close with the
        same word or phrase.
      de: Ein Text, dessen Sätze mit demselben Wort enden.
      fr: Un texte dont les propositions se terminent par le même mot.
    source: Traditional; a classical rhetorical figure
    family: syntax
    attribution: traditional
    kind: restrictive
    languages: [en]
    requires: [tokens]
    deterministic: true
    prompt_hints:
      en: End every clause with the same word or phrase.

  - id: antonymic_substitution
    names: { en: Antonymic substitution }
    definitions:
      en: >-
        A rewriting in which every substantive word is replaced by its opposite,
        turning the text inside out while keeping its shape.
    source: Oulipo, Atlas de littérature potentielle (1981)
    family: word
    attribution: reference
    kind: both
    languages: [en]
    requires: [tokens, lexicon.nouns]
    deterministic: false
    prompt_hints:
      en: Replace every meaningful word with its opposite and keep the grammar unchanged.

  - id: synonymic_substitution
    names: { en: Synonymic substitution }
    definitions:
      en: >-
        A rewriting in which every substantive word is replaced by a synonym,
        repeated until the source is unrecognisable.
    source: Oulipo, Atlas de littérature potentielle (1981)
    family: word
    attribution: reference
    kind: both
    languages: [en]
    requires: [tokens, lexicon.nouns]
    deterministic: false
    prompt_hints:
      en: Replace each meaningful word with a synonym, then do it again to the result.

  - id: tmesis
    names: { en: Tmesis, de: Tmesis, fr: Tmèse }
    definitions:
      en: >-
        A text that splits a word in two and inserts other material between the
        halves, as in "abso-bloody-lutely".
      de: Ein Text, der Wörter aufspaltet und Material dazwischenschiebt.
      fr: Un texte insérant un élément à l'intérieur d'un mot.
    source: Traditional; a classical rhetorical figure
    family: syntax
    attribution: traditional
    kind: both
    languages: [en]
    requires: [tokens]
    deterministic: true
    prompt_hints:
      en: Split words apart and wedge other words inside them.

  - id: melting_text
    names: { en: Melting text }
    definitions:
      en: >-
        A text that loses one word, letter or line at each repetition until nothing
        of it is left.
    source: Oulipo, Atlas de littérature potentielle (1981)
    family: word
    attribution: reference
    kind: both
    languages: [en]
    requires: [tokens]
    deterministic: true
    prompt_hints:
      en: Repeat the passage, dropping one word each time, until it disappears.

  - id: spoonerism
    names: { en: Spoonerism, de: Schüttelreim, fr: Contrepèterie }
    definitions:
      en: >-
        A text built on the exchange of initial sounds between two words, so that
        the swap produces a second, usually comic, reading.
      de: Ein Text, der die Anfangslaute zweier Wörter vertauscht.
      fr: Un texte fondé sur l'échange des sons initiaux de deux mots.
    source: Named for William Archibald Spooner; documented from the 1890s
    family: word
    attribution: reference
    kind: both
    languages: [en]
    requires: [tokens, fold_diacritics]
    deterministic: true
    prompt_hints:
      en: Exchange the opening sounds of two words so that both results are words.

  - id: univocalic_lipogram_pair
    names: { en: Compound constraint }
    definitions:
      en: >-
        A text satisfying two or more named constraints at once, the difficulty
        rising far faster than the count of rules.
    source: Oulipo, Atlas de littérature potentielle (1981)
    family: word
    attribution: reference
    kind: restrictive
    languages: [en]
    requires: [tokens]
    deterministic: true
    prompt_hints:
      en: Satisfy both named constraints in the same passage, without relaxing either.

  - id: definitional_expansion
    names: { en: Definitional expansion }
    definitions:
      en: >-
        A single iteration of definitional literature, in which each substantive
        word is replaced once by its dictionary definition.
    source: Marcel Bénabou and Georges Perec, littérature définitionnelle (1966)
    family: word
    attribution: primary
    kind: both
    languages: [en]
    requires: [tokens, lexicon.nouns]
    deterministic: true
    prompt_hints:
      en: Replace each meaningful word once with its dictionary definition.
