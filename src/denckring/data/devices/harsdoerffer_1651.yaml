# Harsdörffer's Fünffacher Denckring der Teutschen Sprache.
#
# Five concentric paper discs, each carrying a set of word parts. Turning them
# lines up one part from each ring, and reading inward to outward spells a word.
#
# Source: Georg Philipp Harsdörffer, Philosophische und Mathematische
# Erquickstunden, Nürnberg 1651, p. 517. Public domain.
#
# Transcribed by Florian Cramer, whose digitisation is the only machine-readable
# copy of the rings this project could find. The transcription is a faithful
# rendering of a public-domain text and carries no separate claim; the credit is
# owed all the same.
#
# Harsdörffer's own text announces 48 prefixes, 50 initials, 12 medials, 120
# finals and 24 suffixes. The transcription carries 49, 60, 12, 120 and 23. Both
# counts are recorded in the catalogue row; neither has been adjusted to agree
# with the other, and neither yields the 97,209,600 combinations the literature
# repeats — that figure is not divisible by 144 and so cannot be a product of
# rings of 12 and 120 at all.
id: harsdoerffer_1651
name: Fünffacher Denckring der Teutschen Sprache
source: Georg Philipp Harsdörffer, Philosophische und Mathematische Erquickstunden (1651), p. 517
# Which of the 103,680,000 readings are real German words. Al-Khalīl ibn Aḥmad
# al-Farāhīdī enumerated every ordering of a root's consonants and then marked
# which were realised and which were *muhmal*, neglected; `hold` is his policy,
# and it is the default because flagging rather than discarding is the
# intellectual content of the device. Applying it needs a capability core does
# not have, so `denckring apply` reads it only when asked (`attestation: mask`).
mask:
  kind: lexicon
  source: lexicon.words
  unmarked_policy: hold
# Published totals for this device do not reconcile with each other or with the
# product of any stated inventory. Recorded rather than adjudicated: the computed
# figure is `combinations`, from the slots below, and these are what the
# literature says instead.
disputed_totals:
  - value: 82944000
    source: "Harsdörffer's own announced inventory: 48 x 50 x 12 x 120 x 24"
    note: >-
      Arithmetic on the counts his text announces, which are not the counts the
      surviving transcription carries (49, 60, 12, 120, 23).
  - value: 97209600
    source: "Whitney Trettien, Electronic Literature Directory"
    note: >-
      The figure that circulates most widely, and not divisible by 144, so it
      cannot be a product of rings of 12 and 120 at all. A later survey attributes
      the same number to Leibniz's own 1666 calculation; that attribution has no
      primary citation and is not adopted here.
  - value: 101606400
    source: "Markus Hundt, \"Spracharbeit\" im 17. Jahrhundert (2000), fn. 135, p. 285"
    note: Counting assumptions unstated.
