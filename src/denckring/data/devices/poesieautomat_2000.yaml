# Der Landsberger Poesieautomat — the flap-board, not Enzensberger's words.
#
# Hans Magnus Enzensberger designed a poetry automat in "Einladung zu einem
# Poesie-Automaten" (conceived 1974); the machine was built for the festival
# Lyrik am Lech and stood in Landsberg am Lech, 30 June to 2 July 2000. It is a
# split-flap display of the railway-platform kind: six lines of six modules,
# ten flaps each, so pressing the button composes one of 10^36 poems.
#
# Enzensberger died in 2022 and his word lists are in copyright until 2092. The
# mechanism is not. Every one of the 360 fillers below was written for this
# project, without reference to his lists — which is a fact about how this file
# was made, and is what can honestly be said. A claim of word-for-word
# non-overlap with a list this project has never read would not be checkable and
# is not made. The precedent is the row `cent_mille_milliards`, which ships
# Queneau's mechanism with substitute strips. What is his, and what is checked
# here, is the shape of the board.
#
# Three rules make it true that *any* of the 10^36 readings is grammatical
# German, and they are constraints on the design of the modules rather than on
# the storage:
#
#   1. The article is folded into the noun ("der Beton", "die Uhr", "das Eis"),
#      so case and gender agreement never has to be computed across modules.
#   2. Everything after the subject is an adjunct. Prepositional phrases and
#      adverbs stack freely and agree with nothing; the case lives inside the
#      phrase ("im Nebel", "ohne Anlass").
#   3. Every verb is third person singular present and intransitive. Singular
#      because every subject is a nominative singular; intransitive because a
#      transitive verb would want an object the schema does not guarantee. No
#      separable verb appears, since its particle would have to land at the end
#      of a line the board cannot reach.
#
# A fourth rule follows from the schemas rather than being imposed on them, and
# its load-bearing half is the prohibition: no adverb module carries a manner
# adverb or a bare negation. Lines 2, 4 and 6 have no predicate, and either of
# those reads as broken German with no verb to modify. What the sixty flaps are
# instead is a description rather than a further rule — temporal and duration
# adverbs ("inzwischen", "wochenlang"), frequency ("immer", "bisweilen"),
# locative ("überall", "andernorts"), epistemic ("angeblich", "vermutlich"),
# and six quantificational ones (insgesamt, teilweise, zumeist, durchweg,
# reichlich, überwiegend), which scope over the adjunct that follows them
# ("teilweise unter Eis") and so need no verb either.
#
# A fifth rule is about what two modules of one line may say at once. No word
# reaches a line from two different modules, compared with inflection folded, so
# no line can read "Der Hafen ... am Hafen"; and each family of mutually
# exclusive time anchors sits in a single module per line, where alternatives can
# never co-occur. That is why all ten clock times fit on a board of six lines.
# The families are semantic roles rather than prepositions that look alike: when
# on the clock, since when (`seit`), from when (`ab`), how long ago (`vor Jahren`,
# `vor Tagen`), and which month. Two anchors of one role fix the same event twice.
# Roles that differ still stack, and are meant to: `seit X` beside `ab Y`, `um
# acht` beside `gegen Abend`, `ab Mai` beside `Im November`. Absurdity is not
# constrained: "Der Frost gedeiht" stays, because the machine is allowed to be
# strange. It is contradiction that reads as broken rather than as strange, and
# `test_no_line_can_show_one_word_twice` and
# `test_no_line_can_show_two_incompatible_time_anchors` hold the line.
#
# A sixth constraint is about the display and not about German: no filler is
# longer than eleven characters. The board renders letter by letter into
# character cells, so a line costs six fillers plus five spaces, and eleven
# caps the widest line the modules can assemble at 71 columns. Umlauts and ß
# are one character each. `test_no_flap_is_wider_than_the_board` pins both the
# per-flap cap and the assembled width; a longer filler is a line that would
# not fit on the board at a legible cell size, which is why the lexicon is made
# of short concrete nouns and plain verbs rather than of office prose.
#
# What is deliberately absent, which is one of the two constraints no test
# holds. Rules 1, 2, 3, 5 and 6 are properties of the strings and are checked.
# The fourth — no manner adverb, no bare negation — has no test in this
# repository either, and is kept by whoever edits the sixty adverb flaps; it is
# named here so that the count is honest, because a rule believed to be checked
# and not checked is worse than one known to rest on judgement. This seventh
# rests on judgement too, and it is about register: no filler names a camp, a
# guard, a deportation, a ruin, a fire or a restraint, and none may be added.
# Each word taken out under it was innocent read alone — `die Rampe` a loading
# ramp, `das Lager` a warehouse, `das Gleis` a railway track, `die Wache` a
# watch, `der Zaun` a fence, `die Kammer` a chamber. The defect was never one
# flap. It is what a machine emitting 10^36 German poems eventually sets beside
# what, and a reader who meets a single poem cannot know that a pairing was
# drawn rather than meant. Nobody can read 10^36 combinations, so the only
# reliable guard is to keep the material out of the modules rather than to look
# for it in the output. This is measurable exactly, without sampling: of the
# 6,000,000 lines the six modules of a line can assemble, 1,633,120 once
# carried at least one such word and 244,620 carried two or more, which put
# 22.686% of all 10^36 poems — better than one in five — on the wrong side of
# it. Both figures are now zero.
#
# Judge the assembled register, not the isolated word. `unter Strom`, `mit
# Kalk` and `der Bagger` stay: each has one industrial reading here and this
# file holds nothing that can turn it — there is no `Grube`, no `Grab`, no
# `Erde` for the lime to meet, which is the whole of why it is not a problem.
# `im Kessel` was considered as a boiler and declined, because in a war
# register it is an encirclement, and with the lexicon at zero flagged fillers
# one word carrying a second reading would put 100,000 lines back. `ohne
# Zeugen` went for a reading it had only beside `Die Anzeige`, which is a
# notice and a display and also a criminal complaint: the pair read as a
# denunciation, in 1% of that line's readings, and a denunciation belongs to
# the same family as the rest. What the lexicon is made of instead is unchanged
# and is large: weather, water, concrete, foundry, rail freight, workshop,
# administration, cold.
#
# One cost of the clearing is recorded rather than hidden. `kippt`, which
# replaced `brennt`, is the only one of the thirty verbs that is
# ambitransitive. Rule 3 holds for all 10^36 readings regardless, because no
# schema offers a verb an object and the intransitive reading is the only one
# the board can assemble — but a schema that ever gained an object would break
# on this verb first, and that is the price of an otherwise clean removal.
#
# Line schemas, as fixed in the brief for this row:
#
#   line 1   ADV-TIME  V3SG      NP-NOM  PP      ADV     PP
#   line 2   NP-NOM    PP        PP      ADV     PP      PP     (verbless)
#   line 3   PP-PLACE  V3SG      NP-NOM  ADV     PP      PP
#   line 4   NP-NOM    PP        ADV     PP      PP      PP     (verbless)
#   line 5   NP-NOM    V3SG      ADV     PP      PP      PP
#   line 6   ADV-TIME  NP-NOM    PP      PP      ADV     PP     (verbless)
#
# Modules are numbered from zero within their line by position; `line` groups
# them. No filler appears in two modules, which is what makes the count a
# product of thirty-six tens.
