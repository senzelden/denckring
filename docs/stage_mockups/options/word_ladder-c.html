<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Word ladder · C · The one letter</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css">
<style>
  .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:1.4rem;max-width:52rem}
  .col{border-left:1px solid var(--paper-shade);padding:0 .9rem}
  .col:first-child{border-left:0;padding-left:0}
  .col h3{font-family:var(--mono);font-size:.56rem;letter-spacing:.11em;text-transform:uppercase;
          color:var(--lead);margin:0 0 .5rem;font-weight:500}
  .w{font-family:var(--mono);font-size:2.2rem;letter-spacing:.1em;text-transform:uppercase;margin:0;color:var(--ink)}
  .w b{color:var(--rubric);font-weight:400}
  .n{font-family:var(--mono);font-size:.78rem;line-height:1.9;color:var(--lead);margin:.6rem 0 0;cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
  .n:hover{color:var(--ink)}
  .trail{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1.6rem;align-items:center}
  .trail span{font-family:var(--mono);font-size:1rem;text-transform:uppercase;letter-spacing:.08em;
              background:var(--paper-shade);border-radius:2px;padding:.16rem .5rem;color:var(--ink)}
  .trail i{color:var(--lead);font-style:normal}
</style></head><body>
<main class="stage">
  <p class="kicker">Lewis Carroll &middot; Doublets, 1879</p>
  <h1>Word ladder</h1>
  <p class="credit" style="margin:.5rem 0 0">Every word one letter from where you are, laid out by
    which letter changes. Press one and you step; the trail below is the ladder you are building.</p>
  <div class="cols" id="cols"></div>
  <div class="trail" id="trail"></div>
  <p class="verdict yes" id="v"></p>
</main>
<script src="_data.js"></script>
<script>
window.OPTION={scene:'word_ladder',letter:'c',name:'The one letter',
 claim:'You climb it yourself. Four columns, one per letter position, each listing the words that '
     + 'position could become — press one and you take that rung. The rule is not described, it is '
     + 'the only thing you can do.',
 note:'The only <b>interactive</b> direction: the other two solve the ladder and show you the '
    + 'answer. This one makes the viewer do the work, which is closer to what Carroll published — '
    + 'a puzzle rather than a result. It needs a real neighbour index; this sketch has one word.'};
</script>
<script src="_frame.js"></script>
<script>
(()=>{
 // A hand-made neighbourhood around Carroll's own cold→warm.
 const N={cold:[['bold','gold','hold'],['cild'],['cord','coad'],['colt','cols']],
   cord:[['word','ford','lord'],['card','curd'],[],['corn','cork','corm']],
   card:[['ward','hard','lard','yard'],['cord','curd'],[],['cart','carp','cars']],
   ward:[['card','hard','lard'],['word'],[],['warm','wart','wars','warn']],
   warm:[['harm'],['worm'],[],['ward','wart','wars']],
   worm:[['form','norm','dorm'],['warm'],[],['word','wort']]};
 let at='cold'; const trail=['cold'];
 function paint(){
   const cols=document.getElementById('cols'); cols.textContent='';
   const set=N[at]||[[],[],[],[]];
   [...at].forEach((ch,i)=>{
     const c=document.createElement('div'); c.className='col';
     const h=document.createElement('h3'); h.textContent='letter '+(i+1);
     const w=document.createElement('p'); w.className='w';
     [...at].forEach((x,k)=>{const s=document.createElement(k===i?'b':'span');s.textContent=x;w.appendChild(s);});
     c.append(h,w);
     (set[i]||[]).forEach((word)=>{const p=document.createElement('p');p.className='n';p.textContent=word;
       p.onclick=()=>{at=word;trail.push(word);paint();};c.appendChild(p);});
     cols.appendChild(c);
   });
   const t=document.getElementById('trail'); t.textContent='';
   trail.forEach((w,i)=>{if(i){const a=document.createElement('i');a.textContent='→';t.appendChild(a);}
     const s=document.createElement('span');s.textContent=w;t.appendChild(s);});
   const v=document.getElementById('v');
   if(at==='warm'||at==='worm'){v.className='verdict yes';v.textContent='checked — a real ladder of '+(trail.length-1)+' rungs, and you climbed it';}
   else {v.className='verdict';v.style.color='var(--lead)';v.textContent='no verdict yet — a ladder is only a ladder once it arrives';}
 }
 paint();
})();
</script></body></html>
