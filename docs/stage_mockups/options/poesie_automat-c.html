<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Automat · C · The word-stores</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css">
<style>
  .board{background:#14120f;border-radius:3px;padding:7px 0;margin:.8rem 0 0}
  .ln{display:flex;justify-content:center}
  .cell{width:13px;height:23px;line-height:23px;text-align:center;font-family:var(--mono);font-size:12px;
        color:#efe6d2;background:linear-gradient(#2b2823 49%,#1b1815 51%);box-shadow:inset -1px 0 0 rgba(0,0,0,.5)}
  .racks{display:grid;grid-template-columns:repeat(6,1fr);gap:.3rem;margin:.8rem 0 0}
  .rk{background:var(--paper-shade);border-radius:2px;padding:.3rem .35rem}
  .rk h3{font-family:var(--mono);font-size:.5rem;letter-spacing:.08em;text-transform:uppercase;color:var(--lead);
         margin:0 0 .2rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rk ol{list-style:none;margin:0;padding:0}
  .rk li{font-family:var(--display);font-size:.62rem;line-height:1.42;color:#8d857a;cursor:pointer;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rk li:hover{color:var(--ink)}
  .rk li.on{color:var(--paper);background:var(--ink);border-radius:1px;padding:0 .15rem}
  .row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:.6rem;gap:1rem}
</style></head><body>
<main class="stage">
  <p class="kicker">Enzensberger &middot; Landsberg am Lech, 2000</p>
  <h1>Poesie-Automat</h1>
  <div class="board" id="board"></div>
  <div class="racks" id="racks"></div>
  <div class="row">
    <p class="credit">Line one's six word-stores, open. Ten flaps in each; press any to set it.
      Six lines of six modules, ten flaps each &mdash; 10<sup>36</sup> poems.</p>
    <button id="press">Press the button</button>
  </div>
</main>
<script src="_data.js"></script>
<script>
window.OPTION={scene:'poesie_automat',letter:'c',name:'The word-stores',
 claim:'The board with its stock open beneath it: line one’s six modules, all ten flaps of each '
     + 'listed, the one showing lit. The machine stops being a black box that emits poems and '
     + 'becomes a thing with a visible inventory.',
 note:'The only direction that shows the <b>word-lists</b>, which is what the copyright note on '
    + 'this scene is actually about — every flap here is original to the project. Showing one '
    + 'line’s stores costs the other five: sixty flaps fit, three hundred and sixty do not.'};
</script>
<script src="_frame.js"></script>
<script>
(()=>{
 const M=DATA.automat,COLS=71,LINES=6,PER=6,pos=M.map(()=>0);
 const board=document.getElementById('board'),rows=[];
 for(let l=0;l<LINES;l++){const ln=document.createElement('div');ln.className='ln';const cs=[];
   for(let c=0;c<COLS;c++){const d=document.createElement('div');d.className='cell';ln.appendChild(d);cs.push(d);}
   board.appendChild(ln);rows.push(cs);}
 const line=(l)=>{const w=[];for(let m=0;m<PER;m++){const s=l*PER+m;w.push(M[s].flaps[pos[s]].toUpperCase());}
   const t=w.join(' ');const p=Math.max(0,Math.floor((COLS-t.length)/2));
   return (' '.repeat(p)+t).padEnd(COLS,' ').slice(0,COLS);};
 const racks=document.getElementById('racks'),items=[];
 for(let m=0;m<PER;m++){
   const rk=document.createElement('div');rk.className='rk';
   const h=document.createElement('h3');h.textContent=(m+1)+' · '+M[m].name;rk.appendChild(h);
   const ol=document.createElement('ol');items.push([]);
   M[m].flaps.forEach((f,k)=>{const li=document.createElement('li');li.textContent=f;
     li.onclick=()=>{pos[m]=k;paint();};ol.appendChild(li);items[m].push(li);});
   rk.appendChild(ol);racks.appendChild(rk);
 }
 function paint(){
   for(let l=0;l<LINES;l++){const t=line(l);rows[l].forEach((d,c)=>{d.textContent=t[c];});}
   items.forEach((list,m)=>list.forEach((li,k)=>li.classList.toggle('on',pos[m]===k)));
 }
 document.getElementById('press').onclick=()=>{let s=0;
   const t=setInterval(()=>{pos.forEach((_,i)=>{if(Math.random()<.7)pos[i]=Math.floor(Math.random()*M[i].flaps.length);});paint();
     if(++s>11){clearInterval(t);pos.forEach((_,i)=>{pos[i]=Math.floor(Math.random()*M[i].flaps.length);});paint();}},110);};
 paint();
})();
</script></body></html>
