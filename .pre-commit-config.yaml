# Mirrors the lint and typecheck jobs in .github/workflows/ci.yml, so a failure
# here is a failure there.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        # The vendored pronouncing dictionary is 3.6 MB and belongs in the repo.
        args: [--maxkb=4096]

  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: uv run mypy --strict src tests packages/denckring-en-data/src
        language: system
        pass_filenames: false
        types: [python]
