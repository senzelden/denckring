[project]
name = "denckring-en-data"
version = "0.1.1"
description = "English pronunciation data for denckring: exact syllable counts and rhyme"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 AND CC-BY-4.0 AND BSD-2-Clause AND HPND-sell-variant"
license-files = [
    "LICENSE",
    "NOTICE",
    "LICENSE-CMUDICT",
    "LICENSE-WORDNET",
    "LICENSE-SCOWL",
]
authors = [{ name = "Dennis Senzel", email = "dennis.senzel@posteo.com" }]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
# Version-locked: this package subclasses the core English pack, so a core it was
# not built against is not a supported combination. release.yml publishes all three
# from one workflow for the same reason.
dependencies = ["denckring==0.1.1"]

[project.entry-points."denckring.lang"]
en = "denckring_en_data:EnglishDataPack"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/denckring_en_data"]
