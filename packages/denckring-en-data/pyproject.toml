[project]
name = "denckring-en-data"
version = "0.1.0"
description = "English pronunciation data for denckring: exact syllable counts and rhyme"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE-CMUDICT", "LICENSE-WORDNET"]
authors = [{ name = "senzelden", email = "senzelden@gmail.com" }]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = ["denckring"]

[project.entry-points."denckring.lang"]
en = "denckring_en_data:EnglishDataPack"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/denckring_en_data"]
