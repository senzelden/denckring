# Eine Pokemon-Kassette fuer den Poesieautomaten -- explorer-only, never packaged.
#
# The same machine as `poesieautomat_2000`: six lines of six modules, ten flaps
# each, 10^36 poems, the same six line schemas and the same rules. Only the
# flaps are different. It exists so the showcase can demonstrate what
# `DENCKRING_DEVICE_PATH` is for -- one control loads a different set of flaps
# into the same board -- and it is the second cartridge rather than a second
# machine.
#
# WHY THIS FILE IS NOT IN THE PACKAGE
#
# The subjects are the German names of first-generation Pokemon creatures.
# Those names are third-party trademarks of Nintendo / Creatures Inc. / GAME
# FREAK Inc. The catalogue and its data ship under CC BY 4.0, which is a
# licence to reuse and redistribute, and a trademark is not the project's to
# license onward. So this cartridge lives under `apps/explorer`, which is
# classified `Private :: Do Not Upload`, and is reached through
# `DENCKRING_DEVICE_PATH` rather than through the packaged device directory.
# It is a development-tool fixture, used nominatively to name the creatures it
# names, and it is never distributed.
#
# The sixty creature names were written from memory and then checked, one by
# one, against Bulbapedia's list of official German Pokemon names. All sixty are
# correct and none is a fan name. Recorded here because nothing in this
# repository can catch a misspelling: a wrong name would load, render, check and
# pass every test in the suite.
#
# WHERE THE REST OF THE WORDS COME FROM
#
# Everything that is not a creature name is ordinary German in Heiner Mueller's
# register -- concrete, machinery, weather, administration, slow decay. They
# are *individual common words*: single nouns, verbs, adverbs and prepositions.
# No phrase, no line and no title of Mueller's is here, and none was consulted
# in writing this. Mueller died in 1995 and his works are in copyright until
# 2065, so the line drawn is the same one drawn for Enzensberger in
# `poesieautomat_2000`: the register and the mechanism are not anybody's
# property, a sequence of his words would be.
#
# WHAT IS DELIBERATELY ABSENT
#
# Mueller's other half -- the war, the violence, the bodies -- is kept out
# entirely, and the exclusion is drawn wider than a list of words. No weapons,
# no fortification, no wounding, no dying; and no vocabulary that reads as
# camps or atrocity in a German context even where the word is innocent alone
# (`das Lager`, `die Grube`, `die Asche`, `unter Erde`). A board of 10^36
# readings cannot be read through, so the only way to know what it will not
# say is to keep the material out of the modules. What is left is a foundry, a
# rail yard, a building site and bad weather, which is bleak enough.
#
# THE RULES, WHICH ARE THE SAME ONES
#
#   1. The article is folded into the noun ("der Beton", "die Halle"), so case
#      and gender agreement never has to be computed across modules. A creature
#      name is a bare proper noun and takes no article at all, which satisfies
#      the rule rather than straining it: "Karpador rostet im Beton" is clean
#      German, and no module has to know which one it got.
#   2. Everything after the subject is an adjunct. Prepositional phrases and
#      adverbs stack freely and agree with nothing; the case lives inside the
#      phrase ("im Schlamm", "ohne Angabe").
#   3. Every verb is third person singular present and intransitive. Singular
#      because every subject is a nominative singular -- a proper noun is one
#      by construction; intransitive because a transitive verb would want an
#      object the schema does not guarantee. No separable verb appears, since
#      its particle would have to land at the end of a line the board cannot
#      reach.
#
# And the fourth: no adverb module carries a manner adverb or a bare negation,
# because lines 2, 4 and 6 have no predicate and either would read as broken
# German with no verb to modify. The sixty adverbs are temporal, durative,
# frequency, locative, epistemic and quantificational.
#
# The fifth: no word reaches a line from two different modules, compared with
# inflection folded, and each family of mutually exclusive time anchors sits in
# a single module per line. `apps/explorer/tests/test_stage.py` runs the
# shipped board's own detectors over this file.
#
# The sixth is the display: no filler is longer than eleven characters, so a
# line of six flaps plus five spaces fits the board's 71 character cells. The
# widest line this cartridge can assemble is 68 columns (line 1); the packaged
# board reaches 71, and both share the same 71-column display.
#
# Line schemas, identical to `poesieautomat_2000`:
#
#   line 1   ADV-TIME  V3SG      NP-NOM  PP      ADV     PP
#   line 2   NP-NOM    PP        PP      ADV     PP      PP     (verbless)
#   line 3   PP-PLACE  V3SG      NP-NOM  ADV     PP      PP
#   line 4   NP-NOM    PP        ADV     PP      PP      PP     (verbless)
#   line 5   NP-NOM    V3SG      ADV     PP      PP      PP
#   line 6   ADV-TIME  NP-NOM    PP      PP      ADV     PP     (verbless)
id: poesieautomat_pokemon
name: Poesieautomat, Pokemon-Kassette
source: >-
  A second cartridge for the Landsberg flap-board, written for this project.
  The subjects are the German names of first-generation Pokemon creatures,
  which are trademarks of Nintendo / Creatures Inc. / GAME FREAK Inc. and are
  named here nominatively; the cartridge is explorer-only and is never
  distributed. Everything else is ordinary German in Heiner Mueller's
  register, as individual common words rather than as anything he wrote.
