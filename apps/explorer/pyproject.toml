[project]
name = "denckring-explorer"
version = "0.1.0"
description = "A local browser for the denckring catalogue, and a bench for trying procedures"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
    # This is a development tool, not a distribution. It must never be uploaded.
    "Private :: Do Not Upload",
]
dependencies = [
    "denckring[en,de]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "anthropic>=0.69",
    "python-dotenv>=1.2.2",
]

[project.scripts]
explorer = "explorer.__main__:main"

[tool.uv.sources]
denckring = { path = "../..", editable = true }
denckring-en-data = { path = "../../packages/denckring-en-data", editable = true }
denckring-de-data = { path = "../../packages/denckring-de-data", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/explorer"]
