site_name: denckring
site_description: A library of experimental writing procedures, where the validator is the eval
site_url: https://senzelden.github.io/denckring/
repo_url: https://github.com/senzelden/denckring
repo_name: senzelden/denckring
edit_uri: ""

theme:
  name: material
  features:
    - navigation.instant
    - navigation.top
    - navigation.sections
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Gallery: gallery/index.md
  - Design decisions:
      - "1. English API, multilingual content": adr/0001-english-api-multilingual-content.md
      - "2. `check` mandatory, `apply` optional": adr/0002-check-mandatory-apply-optional.md
      - "3. Catalogue in YAML, not SQLite": adr/0003-catalogue-yaml-not-sqlite.md
      - "4. Language packs as capability-declaring plugins": adr/0004-language-packs-as-capabilities.md
      - "5. Continuous `score`, not a boolean": adr/0005-continuous-score.md
      - "6. Dual licence: MIT code, CC BY catalogue": adr/0006-dual-licence.md
      - "7. One module per procedure": adr/0007-one-module-per-procedure.md
      - "8. The catalogue lives inside the package": adr/0008-catalogue-inside-package.md
      - "9. Diacritic folding is a parameter, not a policy": adr/0009-folding-is-a-parameter.md
      - "10. Language packs are discovered through an entry-point group": adr/0010-packs-via-entry-points.md
      - "11. Checkability is a property of the procedure, not of its capabilities": adr/0011-checkability.md
      - "12. Two syllable capabilities, with the weaker one as the floor": adr/0012-syllable-capabilities.md
      - "13. Linguistic data ships as separate distributions": adr/0013-data-as-a-separate-distribution.md
      - "14. Metre is a satisfiability question, not a comparison": adr/0014-metre-as-satisfiability.md
      - "15. One capability per question the lexicon is asked": adr/0015-lexicon-capabilities.md
      - "16. One data pack per language, and a collision is an error": adr/0016-one-pack-per-language.md
      - "17. A device's own data ships with its procedure": adr/0017-devices-ship-with-their-procedures.md
      - "18. Whether the author stated the rule is its own field": adr/0018-attestation.md
      - "19. Figures are alphabets read at several levels": adr/0019-figures.md
      - "20. A corpus is supplied by the reader, never by the package": adr/0020-corpora-are-not-shipped.md
      - "21. Implement the transferable part, not the artefact": adr/0021-the-transferable-part.md
      - "22. German is a built-in default, not an entry point": adr/0022-german-moves-to-a-default.md
      - "23. The German lexicon is Wikidata Lexemes": adr/0023-the-german-lexicon.md
  - Contributing: contributing.md
  - Changelog: changelog.md

# The gallery is generated by scripts/build_docs.py and is not in the nav
# tree beyond its index: 145 entries would drown it. Links from the index and
# from search reach the individual pages.
not_in_nav: |
  gallery/*.md

# Specs and plans are working documents, not publications.
exclude_docs: |
  superpowers/
  seed/

strict: true
