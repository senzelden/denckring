# One witness per declared `violation.rule` the golden corpus does not emit: a
# check call whose report carries that rule. `tests/test_rules.py` runs each one,
# so every rule a row declares is proved emittable by a golden case or by an
# entry here. Recorded from the unit tests' own calls (the shortest text that
# emitted the rule), else found by mutating the row's golden cases, else
# written by hand.
#
# An entry here whose rule a golden case comes to emit is stale, and the test
# says so: delete it.
#
# A `rhyme_undecidable` witness ends each line on a different nonsense word
# (`zxqvkb`, `zxqvkc`, ...). Digits will not do: the tokeniser drops them, so
# `zxqvk0` and `zxqvk1` are the same word and the pair is `identical_rhyme`,
# which is decided by spelling before the dictionary is asked.
witnesses:
- procedure: acrostic
  rule: extra_unit
  lang: en
  params:
