[project]
name = "denckring"
version = "0.1.0"
description = "A library of experimental writing procedures, where the validator is the eval"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 AND CC-BY-4.0"
license-files = ["LICENSE", "NOTICE", "LICENSE-DATA"]
authors = [{ name = "senzelden", email = "senzelden@gmail.com" }]
keywords = ["oulipo", "constrained-writing", "lipogram", "poetics", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
    # Verified in CI on 3.14t, not merely asserted: the package is pure Python
    # and holds no locks.
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
]
dependencies = ["pydantic>=2.7", "pyyaml>=6.0", "typer>=0.12"]

[project.optional-dependencies]
# Exact syllable counts and rhyme, from the CMU Pronouncing Dictionary.
en = ["denckring-en-data==0.1.0"]
# Word membership and a noun list for German, from Wikidata Lexemes.
de = ["denckring-de-data==0.1.0"]
# Everything `de` gives, plus pronunciation, stress and glosses from German
# Wiktionary. A separate extra because its data is CC BY-SA where `de` is CC0,
# and ADR 0013 quarantines a data licence in its own distribution.
de-wiktionary = ["denckring-de-data==0.1.0", "denckring-de-wiktionary==0.1.0"]
# An MCP server, so a model can check its own constrained writing.
mcp = ["mcp[cli]>=2"]

[project.urls]
Homepage = "https://github.com/senzelden/denckring"
Documentation = "https://senzelden.github.io/denckring/"
Repository = "https://github.com/senzelden/denckring"
Issues = "https://github.com/senzelden/denckring/issues"
Changelog = "https://github.com/senzelden/denckring/blob/main/CHANGELOG.md"

[project.scripts]
denckring = "denckring.cli:app"
denckring-mcp = "denckring.mcp.server:main"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
denckring = { workspace = true }
denckring-en-data = { workspace = true }
denckring-de-data = { workspace = true }
denckring-de-wiktionary = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML>=6",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=0.26",
]
# Build-only: regenerates the English lexicon (packages/denckring-en-data). Never
# imported at runtime, never installed by `pip install denckring[en]`.
lexicon = ["wn>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/denckring"]

# The workspace members build their own distributions; a source distribution that
# carried them too would ship the CMU dictionary, the WordNet glosses and the German
# lexicon a second time — 7.1 MB of data this package does not read — under a licence
# expression that does not describe them. The explorer is a development tool and is
# published nowhere. `tests/` and `docs/` stay: downstream packagers run the suite.
[tool.hatch.build.targets.sdist]
exclude = ["/packages", "/apps"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "ANN"]
ignore = ["ANN401"]
# IPA, not typos. Chapter 4 tranche B reads German pronunciations off Wiktionary's
# transcriptions, so `ˈ`, `ː`, `ɡ`, `ɪ`, `ʏ` and `ɑ` appear in docstrings and
# comments that explain what the arithmetic is doing. Naming the six characters
# rather than switching RUF001-003 off keeps the rule live for a real confusable
# arriving anywhere else in the project.
allowed-confusables = ["ˈ", "ː", "ɡ", "ɪ", "ʏ", "ɑ"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
# The error names are the public API fixed by the spec; an "Error" suffix on all
# five would read worse at the call site (`except MissingCapability:`).
"src/denckring/core/errors.py" = ["N818"]

[tool.mypy]
mypy_path = "tests:scripts"
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "scripts"]
addopts = "-q"

[tool.ruff.lint.isort]
known-first-party = ["denckring"]
