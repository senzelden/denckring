[project]
name = "denckring"
version = "0.1.0"
description = "A library of experimental writing procedures, where the validator is the eval"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 AND CC-BY-4.0"
license-files = ["LICENSE", "NOTICE", "LICENSE-DATA"]
authors = [{ name = "senzelden", email = "dennis.senzel@posteo.com" }]
keywords = ["oulipo", "constrained-writing", "lipogram", "poetics", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
    # Verified in CI on 3.14t, not merely asserted: the package is pure Python
    # and holds no locks.
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
]
dependencies = ["pydantic>=2.7", "pyyaml>=6.0", "typer>=0.12"]

[project.optional-dependencies]
# Exact syllable counts and rhyme, from the CMU Pronouncing Dictionary.
en = ["denckring-en-data==0.1.0"]
# Word membership and a noun list for German, from Wikidata Lexemes.
de = ["denckring-de-data==0.1.0"]
# Everything `de` gives, plus pronunciation, stress and glosses from German
# Wiktionary. A separate extra because its data is CC BY-SA where `de` is CC0,
# and ADR 0013 quarantines a data licence in its own distribution.
de-wiktionary = ["denckring-de-data==0.1.0", "denckring-de-wiktionary==0.1.0"]
# Word membership, an ordered noun list, frequency bands and glosses for French,
# from Lexique 3.82 and French Wiktionary. Both CC BY-SA, so one distribution.
fr = ["denckring-fr-data==0.1.0"]
# Frequency bands for German, from the Leipzig Corpora Collection. A separate
# extra because its data is CC BY where `de`'s is CC0, and ADR 0013 quarantines a
# data licence in its own distribution. Light — 434 KB — and deliberately
# independent of `de-wiktionary`, so German `anagram` does not drag in 6.5 MB of
# pronunciations it never reads.
de-frequency = ["denckring-de-data==0.1.0", "denckring-de-frequency==0.1.0"]
# An MCP server, so a model can check its own constrained writing.
mcp = ["mcp[cli]>=2"]

[project.urls]
Homepage = "https://github.com/senzelden/denckring"
Documentation = "https://senzelden.github.io/denckring/"
Repository = "https://github.com/senzelden/denckring"
Issues = "https://github.com/senzelden/denckring/issues"
Changelog = "https://github.com/senzelden/denckring/blob/main/CHANGELOG.md"

[project.scripts]
denckring = "denckring.cli:app"
denckring-mcp = "denckring.mcp.server:main"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
denckring = { workspace = true }
denckring-en-data = { workspace = true }
denckring-de-data = { workspace = true }
denckring-de-wiktionary = { workspace = true }
denckring-fr-data = { workspace = true }
denckring-de-frequency = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML>=6",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=0.26",
    "pytest-cov>=5",
]
# Build-only: regenerates the English lexicon (packages/denckring-en-data). Never
# imported at runtime, never installed by `pip install denckring[en]`.
lexicon = ["wn>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/denckring"]

# The workspace members build their own distributions; a source distribution that
# carried them too would ship the CMU dictionary, the WordNet glosses, the German
# lexicon and now the German pronunciations a second time — 21 MB of data this
# package does not read — under a licence expression that does not describe them. The
# explorer is a development tool and is published nowhere. `tests/` and `docs/` stay:
# downstream packagers run the suite.
#
# `docs/audit/` is excluded on the same argument rather than on size: it is a working
# document — a dated per-procedure snapshot addressed to whoever picks the work up —
# not documentation of what this package does. It describes one commit and dates
# badly, which is the clearest possible reason not to ship it with every release
# built from any commit.
#
# `docs/expansion_ideas/`, `docs/superpowers/` and `docs/seed/` were excluded here for
# the same reason until 2026-09-06, when they were removed from the repository and its
# history outright. The old note said they stayed in git "because the ADRs and the
# changelog cite them and a citation pointing at nothing is worse than a large sdist".
# That cost was accepted by decision rather than avoided: five ADRs now cite documents
# that no longer exist, and ADR 0031 and 0033 open with one of them.
[tool.hatch.build.targets.sdist]
exclude = [
    "/packages",
    "/apps",
    "/docs/audit",
    # Untracked, and that is exactly why it must be named here: `uv build` reads
    # the working tree, not the index, so a directory git ignores still lands in
    # the archive. `docs/superpowers/` is a local scratch area again as of
    # 2026-09-06 and would otherwise push the sdist past its bound.
    "/docs/superpowers",
    # Excluded on size rather than on the working-document argument above: the
    # overview GIF is 3 MB and is documentation of what this package does, so it
    # belongs on the docs site — but a source distribution is what a packager
    # builds from, and a recording is not part of building anything. It stays out
    # of `WORKING_DOCUMENTS` for exactly that reason: that list is about what the
    # docs site refuses, and the site publishes this.
    "/docs/showcase",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "ANN"]
ignore = ["ANN401"]
# IPA, not typos. Chapter 4 tranche B reads German pronunciations off Wiktionary's
# transcriptions, so `ˈ`, `ː`, `ɡ`, `ɪ`, `ʏ` and `ɑ` appear in docstrings and
# comments that explain what the arithmetic is doing. Naming the six characters
# rather than switching RUF001-003 off keeps the rule live for a real confusable
# arriving anywhere else in the project.
allowed-confusables = ["ˈ", "ː", "ɡ", "ɪ", "ʏ", "ɑ"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
# The error names are the public API fixed by the spec; an "Error" suffix on all
# five would read worse at the call site (`except MissingCapability:`).
"src/denckring/core/errors.py" = ["N818"]

[tool.mypy]
# The sixth distribution keeps its build script beside itself, the way the
# French one does, so the case rule of ADR 0038 D3 can be imported by a test
# and typechecked rather than only executed.
mypy_path = "tests:scripts:packages/denckring-de-frequency/scripts"
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "scripts"]
addopts = "-q"

[tool.ruff.lint.isort]
known-first-party = ["denckring"]
