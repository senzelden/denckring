[project]
name = "denckring"
version = "0.1.0"
description = "A library of experimental writing procedures, where the validator is the eval"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "senzelden", email = "senzelden@gmail.com" }]
keywords = ["oulipo", "constrained-writing", "lipogram", "poetics", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.7", "pyyaml>=6.0", "typer>=0.12"]

[project.optional-dependencies]
# Exact syllable counts and rhyme, from the CMU Pronouncing Dictionary.
en = ["denckring-en-data"]

[project.urls]
Homepage = "https://github.com/senzelden/denckring"
Repository = "https://github.com/senzelden/denckring"
Issues = "https://github.com/senzelden/denckring/issues"

[project.scripts]
denckring = "denckring.cli:app"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
denckring = { workspace = true }
denckring-en-data = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML>=6",
    "mkdocs-material>=9.7.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/denckring"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
# The error names are the public API fixed by the spec; an "Error" suffix on all
# five would read worse at the call site (`except MissingCapability:`).
"src/denckring/core/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff.lint.isort]
known-first-party = ["denckring"]

[tool.hatch.build]
artifacts = ["src/denckring/scaffold/templates/*.tmpl"]
