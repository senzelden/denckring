name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra en --extra de
      - run: uv run ruff check
      - run: uv run ruff format --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra en --extra de --extra mcp
      - run: uv run mypy --strict src tests packages/denckring-en-data/src packages/denckring-de-data/src

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # The free-threaded build, on one platform. Nothing here holds a lock
          # or touches a C extension, so the claim costs one job to keep honest
          # — and an unverified claim is worse than none.
          - os: ubuntu-latest
            python: "3.14t"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --extra en --extra de
      - run: uv run pytest -q

  eval:
    # The acceptance criterion the project set itself for unattended runs. A
    # passing test suite is a different claim from a green scoreboard, so this
    # is a gate of its own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra en --extra de
      - run: uv run denckring eval --all
      - run: uv run denckring status

  mcp:
    # The matrix runs without [mcp], so `pytest.importorskip` skips every MCP
    # test there — the extra's own code would otherwise be tested nowhere. One
    # job installs it and runs them for real. A skipped test reports green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra en --extra de --extra mcp
      - run: uv run pytest tests/test_mcp_tools.py -q
      - name: The server starts and lists its four tools
        run: |
          uv run python -c "
          import asyncio
          from denckring.mcp.server import server
          names = {t.name for t in asyncio.run(server.list_tools())}
          assert names == {'list_procedures', 'describe_procedure', 'check_text', 'apply_procedure'}, names
          print('mcp:', sorted(names))
          "

  core-only:
    # Nothing else exercises the install without the data package, and that is
    # the path most likely to break silently: a procedure quietly requiring a
    # capability core does not have would pass every other job here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the core distribution alone
        run: |
          uv venv /tmp/core-only
          VIRTUAL_ENV=/tmp/core-only uv pip install .
      - name: The data-free procedures work
        run: |
          /tmp/core-only/bin/python -c "
          from denckring import check
          assert check('lipogram', 'aaa', forbidden='z').satisfied
          assert check('pangram', 'Victor jagt zwölf Boxkämpfer quer über den großen Sylter Deich', lang='de').satisfied
          print('core-only: data-free procedures OK')
          "
      - name: The data-dependent ones raise, naming the extra
        run: |
          /tmp/core-only/bin/python -c "
          from denckring import check
          from denckring.core.errors import MissingCapability
          try:
              check('iambic_pentameter', 'the cat can see the moon above the tree')
          except MissingCapability as exc:
              print('core-only: raised as expected —', exc)
          else:
              raise SystemExit('iambic_pentameter should require a capability core lacks')
          "

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra en --extra de
      - name: Regenerate the gallery
        run: uv run python scripts/build_docs.py
      - name: Build the site
        run: uv run mkdocs build --strict

  explorer:
    # A development tool, but a tested one: its own suite, which no other job in
    # this workflow collects and which has never run in CI before this job.
    runs-on: ubuntu-latest
    defaults:
      run:
        # uv run --project apps/explorer still executes with the repo root as
        # cwd, so pytest's rootdir search finds this repo's own testpaths
        # config and collects ../../tests instead. Running inside the app's
        # directory is what actually resolves its test paths.
        working-directory: apps/explorer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy --strict src tests
      - run: uv run pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv build --all-packages
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
