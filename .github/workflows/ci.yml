name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --extra en --extra de --extra de-wiktionary --extra de-frequency --extra fr
      - run: uv run ruff check
      - run: uv run ruff format --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --extra en --extra de --extra de-wiktionary --extra de-frequency --extra fr --extra mcp
      - run: >-
          uv run mypy --strict src tests packages/denckring-en-data/src
          packages/denckring-de-data/src packages/denckring-de-wiktionary/src
          packages/denckring-de-frequency/src

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # The free-threaded build, on one platform. Nothing here holds a lock
          # or touches a C extension, so the claim costs one job to keep honest
          # — and an unverified claim is worse than none.
          - os: ubuntu-latest
            python: "3.14t"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --extra en --extra de --extra de-wiktionary --extra de-frequency --extra fr
      - run: uv run pytest -q

  coverage:
    # A floor, not a report. The README's badge states the same 97 this job
    # enforces, so the badge cannot go stale upward-or-downward without CI
    # going red — which is the only way a number in prose stays true here.
    #
    # Measured 97.1% on 2026-09-05: 6,015 of 6,194 statements. The margin over
    # the floor is about seven statements, and hypothesis moves the last one or
    # two between runs, so a drop that turns this red is a real drop. Raising
    # the floor means raising the badge in the same commit.
    #
    # `--extra mcp` because the matrix runs without it and `pytest.importorskip`
    # then skips every MCP test: measuring the suite that skips them would
    # report `mcp/server.py` as uncovered code nobody had chosen not to cover.
    #
    # Scoped to `denckring` alone. The workspace data packages are vendored
    # tables with a few lines of accessor each, and folding them in would move
    # the figure without saying anything about the library.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: >-
          uv sync --extra en --extra de --extra de-wiktionary
          --extra de-frequency --extra fr --extra mcp
      - run: uv run pytest -q --cov=denckring --cov-report=term-missing --cov-fail-under=97

  eval:
    # The acceptance criterion the project set itself for unattended runs. A
    # passing test suite is a different claim from a green scoreboard, so this
    # is a gate of its own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --extra en --extra de --extra de-wiktionary --extra de-frequency --extra fr
      - run: uv run denckring eval --all
      - run: uv run denckring status

  mcp:
    # The matrix runs without [mcp], so `pytest.importorskip` skips every MCP
    # test there — the extra's own code would otherwise be tested nowhere. One
    # job installs it and runs them for real. A skipped test reports green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --extra en --extra de --extra de-wiktionary --extra de-frequency --extra fr --extra mcp
      - run: uv run pytest tests/test_mcp_tools.py -q
      - name: The server starts and lists its four tools
        run: |
          uv run python -c "
          import asyncio
          from denckring.mcp.server import server
          names = {t.name for t in asyncio.run(server.list_tools())}
          assert names == {'list_procedures', 'describe_procedure', 'check_text', 'apply_procedure'}, names
          print('mcp:', sorted(names))
          "

  core-only:
    # Nothing else exercises the install without the data package, and that is
    # the path most likely to break silently: a procedure quietly requiring a
    # capability core does not have would pass every other job here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install the core distribution alone
        run: |
          uv venv /tmp/core-only
          VIRTUAL_ENV=/tmp/core-only uv pip install .
      - name: The data-free procedures work
        run: |
          /tmp/core-only/bin/python -c "
          from denckring import check
          assert check('lipogram', 'aaa', forbidden='z').satisfied
          assert check('pangram', 'Victor jagt zwölf Boxkämpfer quer über den großen Sylter Deich', lang='de').satisfied
          print('core-only: data-free procedures OK')
          "
      - name: The data-dependent ones raise, naming the extra
        run: |
          /tmp/core-only/bin/python -c "
          from denckring import check
          from denckring.core.errors import MissingCapability
          try:
              check('iambic_pentameter', 'the cat can see the moon above the tree')
          except MissingCapability as exc:
              print('core-only: raised as expected —', exc)
          else:
              raise SystemExit('iambic_pentameter should require a capability core lacks')
          "

  german-without-pronunciations:
    # `denckring[de]` is two distributions and either may be installed alone, so
    # the lexical-only install is a real shape a user can have. ADR 0030 puts the
    # choice between the two packs in one factory; this is the job that proves the
    # factory picks the lexical one and that a phonetic row then refuses rather
    # than guessing. Nothing in the suite covers it, because the suite runs with
    # both installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install the lexical German data and not the phonetic
        run: |
          uv venv /tmp/de-lexical
          VIRTUAL_ENV=/tmp/de-lexical uv pip install ".[de]"
      - name: The lexical rows work and the phonetic ones name what is missing
        run: |
          /tmp/de-lexical/bin/python -c "
          from denckring import check
          from denckring.core.errors import MissingCapability
          from denckring.lang import get_pack
          pack = get_pack('de')
          assert type(pack).__name__ == 'GermanDataPack', type(pack).__name__
          assert check('charade', 'Tal', lang='de').satisfied is not None
          try:
              check('iambic_pentameter', 'der Wind bewegt die Blätter in der Nacht', lang='de')
          except MissingCapability as exc:
              assert 'stress' in str(exc), exc
              print('de-lexical: raised as expected —', exc)
          else:
              raise SystemExit('iambic_pentameter needs stress, which this install lacks')
          "

  french-without-data:
    # French ships in core with no data at all, which is a real install shape and
    # the one the suite never runs: it always has `denckring[fr]`. ADR 0034 leaves
    # 18 rows blocked in French — down from ADR 0032's 41, and all of them on
    # `stress` — so every row this job exercises is one `denckring[fr]` unblocks,
    # and each must refuse by naming what is missing rather than guessing.
    #
    # The `phonemes` assertion below has no other home. ADR 0034 gave French
    # `phonemes`, so no installed pack lacks that capability any more, and
    # `tests/test_prosody_robustness.py` had to move its refusal test to `stress`.
    # A core-only install is now the only place a phonemes refusal runs at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install the core distribution alone
        run: |
          uv venv /tmp/fr-core
          VIRTUAL_ENV=/tmp/fr-core uv pip install .
      - name: The data-free French rows work and the data-fed ones name what is missing
        run: |
          /tmp/fr-core/bin/python -c "
          from denckring import check
          from denckring.core.errors import MissingCapability
          assert check('lipogram', 'aaa', forbidden='z', lang='fr').satisfied
          try:
              check('n_plus_7', 'la maison', lang='fr')
          except MissingCapability as exc:
              assert 'lexicon.nouns' in str(exc), exc
              print('fr-core: lexical row raised as expected —', exc)
          else:
              raise SystemExit('n_plus_7 needs lexicon.nouns, which this install lacks')
          try:
              check('alexandrine', 'le temps n\'est plus', lang='fr')
          except MissingCapability as exc:
              assert 'syllables' in str(exc), exc
              print('fr-core: syllabic row raised as expected —', exc)
          else:
              raise SystemExit('alexandrine needs syllables, which this install lacks')
          try:
              check('rhyme_scheme', 'le chat dort\nle chien court', scheme='AA', lang='fr')
          except MissingCapability as exc:
              assert 'phonemes' in str(exc), exc
              print('fr-core: rhyme row raised as expected —', exc)
          else:
              raise SystemExit('rhyme_scheme needs phonemes, which this install lacks')
          "

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --extra en --extra de --extra de-wiktionary --extra de-frequency --extra fr
      - name: Regenerate the gallery
        run: uv run python scripts/build_docs.py
      - name: Build the site
        run: uv run mkdocs build --strict

  explorer:
    # A development tool, but a tested one: its own suite, which no other job in
    # this workflow collects and which has never run in CI before this job.
    runs-on: ubuntu-latest
    defaults:
      run:
        # uv run --project apps/explorer still executes with the repo root as
        # cwd, so pytest's rootdir search finds this repo's own testpaths
        # config and collects ../../tests instead. Running inside the app's
        # directory is what actually resolves its test paths.
        working-directory: apps/explorer
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy --strict src tests
      - run: uv run pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv build --all-packages
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
