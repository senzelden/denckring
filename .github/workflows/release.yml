name: Release

# Two entry points, and the second one is why this file changed before the first
# release rather than after it.
#
# A `v*` tag publishes to PyPI for real. `workflow_dispatch` publishes to TestPyPI
# instead, so the whole path — build, check, upload through Trusted Publishing —
# can be walked once against a registry where a mistake is recoverable. PyPI
# refuses a re-upload of a version that already exists, so without a rehearsal the
# first genuine tag is also the first time this workflow has ever run end to end.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Which index to publish to.
        type: choice
        default: testpypi
        options: [testpypi, none]

# Every `uses:` line below is a commit SHA, not a mutable tag, with the tag it
# was resolved from kept as a trailing `# vN` comment (P1-04). `publish` carries
# `id-token: write` and `attestations: write` — a compromised or retargeted
# action tag in a file with that permission is part of the Trusted Publishing
# trust boundary, not just a build-reproducibility nicety. Twine is pinned to
# an exact version the same way and for the same reason (P3-03): `uvx
# twine@7.0.0` rather than `uvx twine`, so `check dist/*` runs against a Twine
# this file names, not whatever happens to be current the day a tag is pushed.
#
# `.github/dependabot.yml`'s `github-actions` group is what keeps these from
# going stale silently: it bumps a SHA pin's `# vN` comment the same way it
# would bump a bare tag, monthly, in one grouped PR. To refresh one by hand —
# a bump Dependabot hasn't gotten to yet, or a check between its runs — resolve
# the new tag's commit with `git ls-remote --tags <repo> <tag>` (or `--heads`
# for `pypa/gh-action-pypi-publish@release/v1`, which tracks a branch, not a
# tag) and replace both the SHA and the trailing comment together; a SHA with a
# comment that no longer names it is worse than an unpinned tag, because it
# reads as verified when it is not.
jobs:
  # P1-03: a pushed tag must match every workspace version and a stamped
  # changelog section before this workflow is allowed to build or publish —
  # see scripts/release_preflight.py for the check itself. Runs on every
  # trigger, unconditionally — an `if:`-guarded preflight would leave
  # `build`'s `needs: [preflight]` depending on a job that is sometimes
  # skipped, and whether GitHub Actions treats a skipped dependency as
  # satisfied is exactly the kind of thing worth not relying on. Instead the
  # job always runs and the tag/version/changelog check happens only on a
  # `push` (a real tag); `workflow_dispatch` (the TestPyPI rehearsal) has no
  # tag to check against, so it prints why and exits 0.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Verify tag, version and changelog agree (skipped outside a tag push)
        # $GITHUB_EVENT_NAME/$GITHUB_REF_NAME (GitHub's own default env vars,
        # already used the same way by the `notes` job below) rather than
        # ${{ github.ref_name }} inline: a tag name can legally contain shell
        # metacharacters, and an env var doesn't get shell-expanded the way an
        # `${{ }}` substitution does.
        #
        # `uv run python`, not a bare `python3`: the script imports `tomllib`
        # (3.11+, pyproject.toml's own `requires-python`). Without `setup-uv`
        # above, this job had no toolchain step at all and relied on whatever
        # `python3` `ubuntu-latest` happens to ship — true today, but an
        # undeclared dependency on the runner image's default, unlike every
        # other job in this file, which is exactly the kind of thing that
        # breaks a gate silently and only during a release.
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            uv run python scripts/release_preflight.py "$GITHUB_REF_NAME"
          else
            echo "not a tag push — preflight has nothing to check"
          fi

  build:
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv build --all-packages
      - run: uvx twine@7.0.0 check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distributions
          path: dist/

  # Before `publish`, not after it. This used to run last, so a docs failure left
  # the release on PyPI and undocumented — and unrecoverable, because PyPI will not
  # take the version again. It also fails outright on a private repository, where
  # `gh-deploy` needs a paid plan, which meant the old order guaranteed that the
  # first release would publish and then go red.
  docs:
    needs: [preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --extra en
      - run: uv run python scripts/build_docs.py
      # A dispatch run rehearses the site build without deploying it: a rehearsal
      # that pushed to gh-pages would not be a rehearsal.
      - if: github.event_name == 'workflow_dispatch'
        run: uv run mkdocs build --strict
      - if: github.event_name == 'push'
        run: uv run mkdocs gh-deploy --force --strict

  rehearse:
    # TestPyPI, from a manual run. One leg per distribution, for the reason the
    # `publish` matrix below spells out.
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: [preflight, build, docs]
    runs-on: ubuntu-latest
    strategy:
      # Every leg is independent and each says something different: stopping the
      # others on the first failure would hide which of the seven are misconfigured,
      # which is the whole question a rehearsal answers.
      fail-fast: false
      matrix:
        include:
          - {dist: denckring, files: "denckring-", environment: testpypi}
          - {dist: denckring-en-data, files: "denckring_en_data-", environment: testpypi-en-data}
          - {dist: denckring-en-pos, files: "denckring_en_pos-", environment: testpypi-en-pos}
          - {dist: denckring-de-data, files: "denckring_de_data-", environment: testpypi-de-data}
          - {dist: denckring-de-wiktionary, files: "denckring_de_wiktionary-", environment: testpypi-de-wiktionary}
          - {dist: denckring-de-frequency, files: "denckring_de_frequency-", environment: testpypi-de-frequency}
          - {dist: denckring-fr-data, files: "denckring_fr_data-", environment: testpypi-fr-data}
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distributions
          path: all-dist/
      - name: Take only this distribution's artefacts
        run: |
          mkdir -p dist
          cp all-dist/${{ matrix.files }}* dist/
          # An empty or over-full `dist/` is the failure this split can produce and
          # the one an upload would not report: publishing nothing succeeds. Exactly
          # a wheel and an sdist, or stop.
          count=$(ls dist | wc -l)
          test "$count" -eq 2 || {
            echo "expected 2 artefacts for ${{ matrix.dist }}, found $count"; ls -l dist; exit 1;
          }
          ls -l dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Off here and on for the real thing: TestPyPI is periodically pruned,
          # so an attestation made against it outlives what it attests to.
          attestations: false
          # A rehearsal that has been rehearsed before should not fail on that.
          skip-existing: true

  publish:
    # All six distributions publish from one workflow because they must stay
    # version-locked: denckring-en-data subclasses the core English pack,
    # denckring-de-data carries the sole `de` entry point,
    # denckring-de-wiktionary is the pack that entry point resolves to when it is
    # installed, denckring-de-frequency adds `lexicon.graded_words` to that pack
    # under its own licence (ADR 0038), and denckring-fr-data subclasses the core
    # French pack (ADR 0032). `uv build --all-packages` picks up every workspace
    # member, so the sixth needed no change here.
    #
    # One job per distribution, each with its own environment, and that is forced
    # rather than chosen. PyPI requires a *pending* publisher to be unique on
    # (owner, repository, workflow, environment), so six pending publishers sharing
    # one environment cannot be registered at all — the second is refused with "a
    # pending trusted publisher matching this configuration has already been
    # registered for a different project name" (pypi/warehouse#16920). Environment
    # is the only part of that tuple this workflow can vary, so it varies.
    #
    # The alternatives were worse: create the projects with API tokens and enrol
    # publishers afterwards, or publish one distribution per release event until
    # each pending publisher has been converted. The first reintroduces the upload
    # token this whole arrangement exists to avoid; the second breaks the version
    # lock these six are released under.
    if: github.event_name == 'push'
    needs: [preflight, build, docs]
    runs-on: ubuntu-latest
    strategy:
      # A partial release is the failure mode here, and it is worth seeing whole:
      # if one distribution's publisher is misconfigured, the remaining five should
      # still report rather than be cancelled. PyPI will not re-take a version that
      # landed, so the recovery is a version bump either way — knowing which legs
      # succeeded is what makes that recovery short.
      fail-fast: false
      matrix:
        include:
          - {dist: denckring, files: "denckring-", environment: pypi}
          - {dist: denckring-en-data, files: "denckring_en_data-", environment: pypi-en-data}
          - {dist: denckring-en-pos, files: "denckring_en_pos-", environment: pypi-en-pos}
          - {dist: denckring-de-data, files: "denckring_de_data-", environment: pypi-de-data}
          - {dist: denckring-de-wiktionary, files: "denckring_de_wiktionary-", environment: pypi-de-wiktionary}
          - {dist: denckring-de-frequency, files: "denckring_de_frequency-", environment: pypi-de-frequency}
          - {dist: denckring-fr-data, files: "denckring_fr_data-", environment: pypi-fr-data}
    environment: ${{ matrix.environment }}
    permissions:
      # Trusted Publishing. No API token is stored in repository secrets.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distributions
          path: all-dist/
      - name: Take only this distribution's artefacts
        run: |
          mkdir -p dist
          cp all-dist/${{ matrix.files }}* dist/
          # `denckring-` is unambiguous because every other distribution builds with
          # underscores — denckring_en_data-0.1.0 and so on — so the core's prefix
          # cannot swallow its siblings. The count below is what actually enforces it.
          count=$(ls dist | wc -l)
          test "$count" -eq 2 || {
            echo "expected 2 artefacts for ${{ matrix.dist }}, found $count"; ls -l dist; exit 1;
          }
          ls -l dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true

  # The release notes existed twice because somebody remembered, which is not a
  # mechanism. 0.1.0's were written by hand 26 minutes after its tag; 0.1.1's were
  # nearly missed entirely, and would have left a published version with no notes
  # on GitHub at all. `CHANGELOG.md` is already stamped with the section for the
  # version being released — `## [0.1.1] - 2026-09-08` — so the notes are a
  # consequence of stamping rather than a separate act of memory.
  #
  # After `publish`, not before: notes announcing a version PyPI does not have are
  # worse than late ones. `needs` therefore gates on the six publish legs, and
  # `fail-fast: false` above means a partial release reaches this job with a
  # failure recorded, so `if: success()` is what keeps the notes honest.
  notes:
    if: github.event_name == 'push'
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cut the section for this tag out of the changelog
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # From this version's heading to the next one, minus both headings. awk
          # rather than sed so an unmatched version yields nothing and fails below
          # instead of silently publishing the whole file.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/       { exit }
            found                   { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || {
            echo "CHANGELOG.md has no '## [$version]' section — stamp it before tagging"
            exit 1
          }
          echo "--- notes for $version ---"; cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "denckring ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --latest \
            --verify-tag
