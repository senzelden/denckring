name: Bug report
description: A procedure gives the wrong answer, or something crashes
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If a procedure disagrees with a literary authority about what a form requires,
        that is a bug — please say which authority.
  - type: input
    id: procedure
    attributes:
      label: Procedure
      placeholder: lipogram
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: What you ran
      description: The command or the `check(...)` call, with the text and parameters.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`denckring --version`, and whether `denckring[en]` is installed."
    validations:
      required: true
